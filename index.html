<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradient Galaxy</title>
<script>
// apply saved theme before first paint
try{ const s=JSON.parse(localStorage.getItem("gradientGalaxy.tdt4172.v1")||"{}"); if(s.theme==="dark"||s.theme==="light") document.documentElement.setAttribute("data-theme", s.theme); }catch(e){}
</script>
<style>
:root{
  --bg:#070b1d; --bg2:#121a3a; --panel:rgba(18,25,58,.82); --panel-solid:#141c3e; --border:rgba(140,160,255,.22);
  --text:#e9ecff; --muted:#9aa3cf; --accent:#7c8cff; --accent2:#ff7ad9; --good:#3ddc97; --bad:#ff5d73; --warn:#ffc857;
  --opt:rgba(30,40,88,.85); --opt-hover:#253170; --shadow:0 10px 40px rgba(0,0,0,.45); --code:#0c1230; --skymode:0;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#dfe7ff; --bg2:#f6f0ff; --panel:rgba(255,255,255,.86); --panel-solid:#fff; --border:rgba(60,70,160,.18);
    --text:#1b1f3b; --muted:#5a6191; --accent:#4b5cf0; --accent2:#d63aa8; --good:#13a36b; --bad:#e0314b; --warn:#b57a00;
    --opt:rgba(238,241,255,.92); --opt-hover:#e1e6ff; --shadow:0 10px 30px rgba(40,50,120,.15); --code:#f1f3fb; --skymode:1;
  }
}
:root[data-theme="light"]{
  --bg:#dfe7ff; --bg2:#f6f0ff; --panel:rgba(255,255,255,.86); --panel-solid:#fff; --border:rgba(60,70,160,.18);
  --text:#1b1f3b; --muted:#5a6191; --accent:#4b5cf0; --accent2:#d63aa8; --good:#13a36b; --bad:#e0314b; --warn:#b57a00;
  --opt:rgba(238,241,255,.92); --opt-hover:#e1e6ff; --shadow:0 10px 30px rgba(40,50,120,.15); --code:#f1f3fb; --skymode:1;
}
:root[data-theme="dark"]{
  --bg:#070b1d; --bg2:#121a3a; --panel:rgba(18,25,58,.82); --panel-solid:#141c3e; --border:rgba(140,160,255,.22);
  --text:#e9ecff; --muted:#9aa3cf; --accent:#7c8cff; --accent2:#ff7ad9; --good:#3ddc97; --bad:#ff5d73; --warn:#ffc857;
  --opt:rgba(30,40,88,.85); --opt-hover:#253170; --shadow:0 10px 40px rgba(0,0,0,.45); --code:#0c1230; --skymode:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--text);background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:34px;filter:drop-shadow(0 0 10px rgba(124,140,255,.7));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.brand h1{margin:0;font-size:24px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:13px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.seg.big-seg button{padding:9px 16px;font-size:15px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.screen{display:none}
.screen.active{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.hero p{color:var(--muted);margin:.3em 0}
.big{border:0;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 24px rgba(124,140,255,.4);transition:transform .15s}
.big:hover:not(:disabled){transform:translateY(-2px) scale(1.02)}
.big:disabled{opacity:.45}
.ghost{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:11px 16px;font-weight:600}
.ghost:hover:not(:disabled){border-color:var(--accent)}
.ghost:disabled{opacity:.4}
.ghost.on{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--panel))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--opt);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.stat.level{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--opt)),color-mix(in srgb,var(--accent2) 25%,var(--opt)))}
.lvlbar{height:6px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:6px}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff7ad9)}
h2{margin:.2em 0 .6em;font-size:20px}
h3{margin:.8em 0 .4em;font-size:16px}
.modebox{margin-top:14px;padding:12px;border-radius:14px;background:var(--opt);border:1px solid var(--border)}
.modebox .desc{font-size:13px;color:var(--muted);margin:6px 0 0}
.examopts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.planet{position:relative;border:1px solid var(--border);background:var(--panel);border-radius:16px;padding:14px 10px 12px;text-align:center;transition:transform .2s,border-color .2s}
.planet:hover{transform:translateY(-3px);border-color:var(--accent)}
.orb{width:62px;height:62px;margin:0 auto 8px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:26px;box-shadow:inset -10px -8px 18px rgba(0,0,0,.35),0 0 18px var(--glow,transparent);animation:spin 9s linear infinite}
.orb.ringed::after{content:"";position:absolute;width:92px;height:22px;border:3px solid rgba(255,255,255,.45);border-radius:50%;transform:rotate(-18deg)}
@keyframes spin{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.planet .pname{font-weight:700;font-size:14px}
.planet .tname{font-size:12px;color:var(--muted);min-height:2.6em}
.bar{height:6px;border-radius:6px;background:var(--opt);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));background-size:300% 100%}
.planet .acc{font-size:11px;color:var(--muted);margin-top:3px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.resume{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--warn);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.track{position:relative;flex:1;min-width:220px;height:40px}
.track .line{position:absolute;left:14px;right:14px;top:19px;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 6px,transparent 6px 12px);opacity:.5}
.track .dot{position:absolute;top:10px;width:20px;height:20px;border-radius:50%;background:var(--opt);border:2px solid var(--border);transform:translateX(-50%);padding:0}
.track .dot.good{background:var(--good);border-color:var(--good)}
.track .dot.bad{background:var(--bad);border-color:var(--bad)}
.track .dot.skip{background:var(--muted);border-color:var(--muted)}
.track .dot.viewing{outline:3px solid var(--accent);outline-offset:2px}
.track .dot:disabled{cursor:default}
.track .rocket{position:absolute;top:-2px;font-size:26px;transform:translateX(-50%) rotate(45deg);transition:left .6s cubic-bezier(.5,1.6,.4,1);filter:drop-shadow(0 0 6px rgba(255,180,80,.8));pointer-events:none}
.score{font-size:20px;font-weight:800;min-width:110px;text-align:right}
.score small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qcard{position:relative}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--opt);border:1px solid var(--border)}
.badge.exam{background:rgba(255,200,87,.18);border-color:rgba(255,200,87,.5)}
.badge.kind{background:color-mix(in srgb,var(--accent2) 18%,var(--opt));border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
.badge.topic{color:#fff;border:0}
.badge.review{background:color-mix(in srgb,var(--accent) 25%,var(--opt))}
.qtext{font-size:18px;margin:6px 0 12px}
table.cm{border-collapse:collapse;margin:8px 0;font-size:15px}
table.cm th,table.cm td{border:1px solid var(--border);padding:4px 10px;text-align:center}
table.cm th{background:var(--opt);font-weight:600}
code{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;font-size:.92em;background:var(--code);padding:1px 5px;border-radius:5px}
pre.code{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:14px;margin:0 0 12px}
pre.code code{background:none;padding:0}
.formula{background:var(--code);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.7;overflow-x:auto}
.formula .fl{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.formula sub,.formula sup{font-size:.72em}
.fig{display:flex;justify-content:center;margin:0 0 12px}
.fig svg{max-width:100%;height:auto;background:var(--panel-solid);border-radius:12px;border:1px solid var(--border)}
.opts{display:grid;gap:9px}
.opts.tfopts{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid transparent;background:var(--opt);border-radius:12px;padding:11px 14px;transition:background .15s,transform .1s,border-color .15s}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel-solid);border:1px solid var(--border)}
.opt .k.box{font-size:18px;border-radius:6px}
.opt.tf{justify-content:center;align-items:center;font-size:18px;font-weight:700;padding:16px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--opt))}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--opt))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--opt))}
.opt.missed{border:2px dashed var(--good)}
.opt.dim{opacity:.55}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--border);background:var(--opt);display:none}
.feedback.show{display:block;animation:fadein .3s}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
.feedback .quip{font-weight:800;font-size:17px;margin-bottom:6px}
.pts{float:right;font-weight:800;font-size:18px}
.pts.good{color:var(--good)} .pts.bad{color:var(--bad)}
.ex-row{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--panel-solid);border-left:4px solid var(--muted)}
.ex-row.good{border-left-color:var(--good)} .ex-row.bad{border-left-color:var(--bad)} .ex-row.warn{border-left-color:var(--warn)}
.ex-row ul{margin:4px 0 0;padding-left:20px}
.ex-why{margin:6px 0;font-size:15px}
.ex-note{font-size:14px;color:var(--muted);margin-top:3px}
details.allopts{margin-top:8px}
details.allopts summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
details.allopts ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
details.allopts li{padding:7px 10px;border-radius:10px;background:var(--panel-solid);font-size:14px}
details.allopts li .mk{display:inline-block;width:20px;font-weight:900}
details.allopts li.t .mk{color:var(--good)} details.allopts li.f .mk{color:var(--bad)}
details.allopts .note{color:var(--muted);font-size:13px;margin:2px 0 0 20px}
.you{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:4px;white-space:nowrap}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.glow{animation:glow .7s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,220,151,0)}40%{box-shadow:0 0 0 8px rgba(61,220,151,.35)}100%{box-shadow:var(--shadow)}}
.fx{position:fixed;pointer-events:none;z-index:50;font-size:34px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6) rotate(200deg)}}
.banner{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;font-size:clamp(26px,6vw,52px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#ff7ad9,#7c8cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1.4s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
/* exam navigator */
.nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup .gl{font-size:11px;color:var(--muted)}
.navgroup .chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--opt);font-size:13px;font-weight:700;position:relative;padding:0}
.chip.ans{background:color-mix(in srgb,var(--accent) 45%,var(--opt));border-color:var(--accent)}
.chip.cur{outline:3px solid var(--accent2);outline-offset:1px}
.chip.flag::after{content:"🚩";position:absolute;top:-9px;right:-7px;font-size:12px}
.confirm{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel));display:none}
.confirm.show{display:block}
/* result */
.rank{text-align:center;padding:10px 0 4px}
.rank .em{font-size:64px;display:block;animation:bob 3s ease-in-out infinite}
.rank .title{font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank .num{font-size:40px;font-weight:900;margin:4px 0}
.rank .sub{color:var(--muted)}
.grade{display:inline-block;margin-top:6px;font-size:22px;font-weight:900;padding:4px 16px;border-radius:12px;background:var(--opt);border:1px solid var(--border)}
.list{display:grid;gap:8px;margin-top:12px}
.item{border:1px solid var(--border);border-left:5px solid var(--muted);border-radius:12px;padding:10px 12px;background:var(--opt)}
.item.good{border-left-color:var(--good)} .item.bad{border-left-color:var(--bad)}
.item .head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.item .qq{margin:4px 0;font-size:15px}
.item > details > summary{cursor:pointer;color:var(--accent);font-size:14px}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th,table.log td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
table.log td.n,table.log th.n{text-align:right;white-space:nowrap}
footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 6px}
@media (max-width:700px){
  .hero{grid-template-columns:1fr}
  .qtext{font-size:16px}
  .planets{grid-template-columns:repeat(2,1fr)}
  .brand h1{font-size:20px}
  .score{min-width:auto}
  .opts.tfopts{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.numwrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin{font:inherit;font-size:20px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--opt);color:var(--text);width:min(240px,100%)}
.numin:focus{outline:none;border-color:var(--accent)}
.numin.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--opt))}
.numin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--opt))}
.numunit{font-size:18px;font-weight:700;color:var(--muted)}
.ehint{font-size:12px;color:var(--warn);min-height:1em;margin-top:6px}
#printReport{display:none}
.rep{font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;background:#fff;
  --text:#111;--muted:#555;--panel-solid:#f6f7fb;--opt:#f1f3fb;--border:#ccd2e6;--good:#13a36b;--bad:#e0314b;--warn:#b57a00;--accent:#4b5cf0;--accent2:#d63aa8;--code:#f1f3fb}
.rep h1{font-size:22px;margin:0 0 2px}.rep .rsub{color:#555;margin-bottom:10px}
.rep .rsum{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid #ccd2e6;border-radius:10px;padding:10px 14px;margin:8px 0 14px}
.rep .rsum b{font-size:20px}.rep .rgrade{font-size:26px;font-weight:900;border:2px solid #4b5cf0;border-radius:8px;padding:0 12px}
.rep table.log{width:100%;border-collapse:collapse;margin-bottom:14px}.rep table.log th,.rep table.log td{border-bottom:1px solid #ccd2e6;padding:4px 6px;text-align:left}.rep td.n,.rep th.n{text-align:right}
.rep .rq{border:1px solid #ccd2e6;border-left:5px solid #999;border-radius:8px;padding:8px 12px;margin:0 0 10px;break-inside:avoid;page-break-inside:avoid}
.rep .rq.good{border-left-color:#13a36b}.rep .rq.bad{border-left-color:#e0314b}
.rep .rqh{display:flex;justify-content:space-between;color:#555;font-size:12px;margin-bottom:4px}
.rep .rqt{font-size:14px;margin:2px 0 6px}
.rep .fig{display:block;margin:4px 0 6px}.rep .fig svg{max-width:100%;height:auto;background:#fff;border:1px solid #ccd2e6;border-radius:8px}
.rep .allopts-flat ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px}
.rep .allopts-flat li{padding:5px 8px;border-radius:6px;background:#f6f7fb}
.rep .allopts-flat li .mk{display:inline-block;width:18px;font-weight:900}.rep .allopts-flat li.t .mk{color:#13a36b}.rep .allopts-flat li.f .mk{color:#e0314b}
.rep .allopts-flat .note{color:#555;font-size:12px;margin:2px 0 0 18px}
.rep .ex-row{background:#f6f7fb}
.rep pre.code{background:#f1f3fb;border:1px solid #ccd2e6;white-space:pre-wrap}
.rep .formula{background:#f1f3fb;border-color:#ccd2e6;border-left-color:#4b5cf0;break-inside:avoid}
@media print{
  @page{margin:14mm 12mm}
  html,body{background:#fff!important}
  body>*:not(#printReport){display:none!important}
  #printReport{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">🚀</span><div><h1>Gradient Galaxy</h1><small data-i="subtitle"></small></div></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Language"><button data-lang="no">NO</button><button data-lang="en">EN</button></div>
      <button class="pill" id="themeBtn"></button>
      <button class="pill" id="soundBtn"></button>
      <button class="pill" id="homeBtn" data-i="map"></button>
    </div>
  </header>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="panel hero">
      <div>
        <h2 data-i="welcome"></h2>
        <p data-i="intro"></p>
        <p data-i="rules"></p>
        <div class="modebox">
          <div class="seg big-seg" role="group" aria-label="Mode"><button data-mode="practice" data-i="modePractice"></button><button data-mode="exam" data-i="modeExam"></button></div>
          <p class="desc" id="modeDesc"></p>
          <div class="examopts" id="examOpts">
            <span class="hint" data-i="length"></span>
            <div class="seg" role="group" aria-label="Exam length"><button data-len="7">7</button><button data-len="20">20</button><button data-len="40">40</button></div>
            <label class="toggle"><input type="checkbox" id="timerOn"><span id="timerLabel"></span></label>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="big" id="launchBtn"></button>
          <button class="ghost" id="logBtn" data-i="log"></button>
        </div>
        <div id="resumeBox"></div>
        <label class="toggle" style="margin-top:12px"><input type="checkbox" id="examOnly"><span data-i="examOnly"></span></label>
      </div>
      <div class="stats" id="homeStats"></div>
    </div>
    <h2 style="margin-top:18px" data-i="pickPlanet"></h2>
    <div class="planets" id="planetGrid"></div>
  </section>

  <!-- PRACTICE -->
  <section id="play" class="screen">
    <div class="hud">
      <div class="track" id="track"></div>
      <div class="score" id="liveScore"></div>
    </div>
    <div class="panel qcard" id="qcard">
      <div class="qmeta" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div id="qextra"></div>
      <div id="opts"></div>
      <div class="actions">
        <button class="ghost" id="prevBtn" data-i="prev"></button>
        <span class="hint" id="keysHint"></span>
        <div class="row">
          <button class="ghost" id="skipBtn"></button>
          <button class="big" id="lockBtn" data-i="lock" style="display:none"></button>
          <button class="ghost" id="fwdBtn" style="display:none"></button>
          <button class="big" id="nextBtn" style="display:none"></button>
        </div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>
  </section>

  <!-- EXAM -->
  <section id="exam" class="screen">
    <div class="hud">
      <div class="row"><b id="examTitle"></b><span class="hint" id="examProgress"></span></div>
      <div class="row"><span class="timer" id="examTimer" style="display:none"></span><button class="big" id="submitBtn" data-i="submit"></button></div>
    </div>
    <div class="panel" style="margin-bottom:12px;padding:12px"><div class="nav" id="examNav"></div></div>
    <div class="confirm panel" id="examConfirm"></div>
    <div class="panel qcard" id="eqcard" style="margin-top:12px">
      <div class="qmeta" id="eqmeta"></div>
      <div class="qtext" id="eqtext"></div>
      <div id="eqextra"></div>
      <div id="eopts"></div>
      <div class="actions">
        <button class="ghost" id="ePrevBtn" data-i="prev"></button>
        <div class="row">
          <button class="ghost" id="eFlagBtn"></button>
          <button class="big" id="eNextBtn" data-i="nextQ"></button>
        </div>
      </div>
      <div class="ehint" id="eHint"></div>
      <div class="hint" style="margin-top:8px" data-i="examKeys"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="panel">
      <div class="rank" id="rank"></div>
      <div class="row" style="justify-content:center;margin:10px 0">
        <button class="big" id="againBtn"></button>
        <button class="ghost" id="pdfBtn" data-i="exportPdf"></button>
        <button class="ghost" id="toMapBtn" data-i="map"></button>
      </div>
      <div id="groupTable"></div>
      <h2 data-i="debrief"></h2>
      <div class="list" id="review"></div>
    </div>
  </section>

  <!-- LOG -->
  <section id="log" class="screen">
    <div class="panel">
      <h2 data-i="log"></h2>
      <div class="stats" id="logStats" style="margin-bottom:12px;grid-template-columns:repeat(3,1fr)"></div>
      <table class="log" id="logTable"></table>
      <h3 data-i="examHistory"></h3>
      <div id="examHist"></div>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="resetBtn" data-i="reset"></button>
      </div>
    </div>
  </section>
  <footer data-i="footer"></footer>
</div>
<div id="printReport"></div>

QB.push(
{id:"e25-1.1",t:0,s:"e25",
 q:["Du har et datasett med <b>Region</b> (kategorisk, 5 verdier), <b>Daily_usage</b> (kontinuerlig), <b>Paid_user</b> (kategorisk, {yes, no}) og <b>Converted</b> (target, {0,1}). Du skal trene en logistisk regresjonsmodell. Hvilket preprosesseringssteg er korrekt og nødvendig?",
    "Your dataset has <b>Region</b> (categorical, 5 values), <b>Daily_usage</b> (continuous), <b>Paid_user</b> (categorical, {yes, no}) and <b>Converted</b> (target, {0,1}). You will train a logistic regression model. Which preprocessing step is correct and necessary?"],
 o:[["Transformer de kategoriske variablene Region og Paid_user til numeriske verdier før trening","Convert the categorical variables Region and Paid_user to numeric values before training"],
    ["Normaliser Converted slik at gjennomsnittet er 0 før trening","Normalise Converted so that its mean is 0 before training"],
    ["Tilpass skaleringen av Daily_usage på hele datasettet for å sikre konsistent skalering","Fit the scaling of Daily_usage on the whole dataset to ensure consistent scaling"],
    ["Fjern alle kategoriske variabler fordi logistisk regresjon kun støtter numeriske input","Drop all categorical variables because logistic regression only supports numeric input"]],

{id:"e25-1.4",t:0,s:"e25",
 q:["Hvis du bruker min–maks-skalering på en feature x, hva er riktig måte å utføre skaleringen på når du trener og evaluerer en modell?",
    "If you apply min–max scaling to a feature x, what is the correct way to do the scaling when training and evaluating a model?"],
 o:[["Tilpass skaleringen på hele datasettet, og splitt deretter i trening og test","Fit the scaling on the whole dataset, then split into train and test"],
    ["Tilpass skaleringen kun på testdatasettet, og bruk den deretter på treningsdatasettet","Fit the scaling only on the test set, then apply it to the training set"],
    ["Splitt datasettet i trening og test, tilpass skaleringen kun på treningsdatasettet, og bruk den på testdatasettet","Split into train and test, fit the scaling only on the training set, and apply it to the test set"],
    ["Tilpass separate skaleringer uavhengig på treningsdatasettet og testdatasettet","Fit separate scalings independently on the training set and the test set"]],

{id:"e24-4",t:0,s:"e24",
 q:["Du har laget en maskinlæringsmodell og skal nå teste den. Hvilken av disse vil du bruke til å preprosessere testdataene?",
    "You have built an ML model and now want to test it. Which of these do you use to preprocess the test data?"],
 o:[["<code>Scaler.transform(x_test)</code>, der Scaler-objektet først ble tilpasset på treningsdataene","<code>Scaler.transform(x_test)</code>, where the Scaler object was first fitted on the training data"],
    ["<code>Scaler.fit(x_test)</code>, slik at Scaler-objektet kan gjenbrukes","<code>Scaler.fit(x_test)</code>, so the Scaler object can be reused"],
    ["<code>Scaler().fit_transform(x_test)</code>, slik at preprosesseringen tilpasses testdataene før disse transformeres","<code>Scaler().fit_transform(x_test)</code>, so preprocessing adapts to the test data before transforming it"]],
 a:0,w:["Fit på trening, transform på test. Å tilpasse på testdata gir lekkasje og en annen skala enn modellen ble trent på.","Fit on train, transform on test. Fitting on test data leaks information and gives a different scale than the model was trained with."]},
{id:"e25-10.1",t:0,s:"e25",

    "You trained a model with the code above and now want to evaluate it on X_test. Which line applies the same scaling to the test data?"],

    ["<code>X_test_scaled = scaler.fit(X_test)</code>","<code>X_test_scaled = scaler.fit(X_test)</code>"]],

    ["<code>pandas.Series.split_dataset(X, y)</code>","<code>pandas.Series.split_dataset(X, y)</code>"],
    ["<code>matplotlib.pyplot.partition(X, y)</code>","<code>matplotlib.pyplot.partition(X, y)</code>"]],

{id:"n-0.1",t:0,s:"notes",

    ["Estimat av funksjonsverdi basert på data","Estimating a function value based on data"],
    ["Evaluering av utvalgte metrikker på usette testdata","Evaluating chosen metrics on unseen test data"],

{id:"p-0.1",t:0,s:"new",

{id:"p-0.2",t:0,s:"new",
 q:["Hvorfor bruker vi ofte one-hot-koding for en nominell variabel som Region = {Nord, Sør, Øst, Vest, Midt} i stedet for å kode den som 1, 2, 3, 4, 5?",

{id:"p-0.3",t:0,s:"new",
 q:["Hva er <i>data leakage</i> (datalekkasje)?","What is <i>data leakage</i>?"],
 o:[["At treningsdata går tapt under lagring","Training data getting lost during storage"],
    ["At informasjon fra test-/valideringsdata (eller fra fremtiden) havner i treningen, slik at evalueringen blir for optimistisk","Information from test/validation data (or from the future) ending up in training, making the evaluation too optimistic"],
    ["At modellen har for mange parametere","The model having too many parameters"],
    ["At features har ulik skala","Features having different scales"]],

{id:"p-0.4",t:0,s:"new",

{id:"p-0.5",t:0,s:"new",

 a:1,w:["Et program lærer av erfaring E på oppgave T hvis ytelsen P på T forbedres med E.","A program learns from experience E on task T if its performance P on T improves with E."]},
{id:"p-0.6",t:0,s:"new",
 q:["Hva skiller <i>veiledet</i> (supervised) fra <i>uveiledet</i> (unsupervised) læring?","What separates <i>supervised</i> from <i>unsupervised</i> learning?"],

 q:["Hvilken av disse er en korrekt implementasjon av binary cross entropy loss?","Which of these is a correct implementation of binary cross entropy loss?"],
 o:[["<code>-y*np.log(1-y_pred) - (1-y)*np.log(y_pred)</code>","<code>-y*np.log(1-y_pred) - (1-y)*np.log(y_pred)</code>"],["<code>-y_pred*np.log(1-y) - (1-y_pred)*np.log(y)</code>","<code>-y_pred*np.log(1-y) - (1-y_pred)*np.log(y)</code>"],["<code>-y*np.log(y_pred) - (1-y)*np.log(1-y_pred)</code>","<code>-y*np.log(y_pred) - (1-y)*np.log(1-y_pred)</code>"],["<code>-y_pred*np.log(y) - (1-y_pred)*np.log(1-y)</code>","<code>-y_pred*np.log(y) - (1-y_pred)*np.log(1-y)</code>"]],
 a:2,w:["Logaritmen tas av prediksjonen (y er 0/1, log(0) er udefinert). Når y = 1 straffes lav y_pred via −log(y_pred).","The log is taken of the prediction (y is 0/1 and log(0) is undefined). When y = 1, a low y_pred is penalised via −log(y_pred)."]},
{id:"e24-12",t:1,s:"e24",
 q:["Hvilken type parameter er læringsraten?","What kind of parameter is the learning rate?"],
 o:[["En testparameter","A test parameter"],["En modellparameter","A model parameter"],["En treningsparameter","A training parameter"],["En hyperparameter","A hyperparameter"]],
 a:3,w:["Den velges av oss før treningen og læres ikke fra data, i motsetning til w og b.","We choose it before training and it is not learned from data, unlike w and b."]},
{id:"e24-13",t:1,s:"e24",
 q:["Hva angir batch size?","What does batch size specify?"],
 o:[["Antall ganger modellen oppdateres per epoke","The number of model updates per epoch"],["Antall ganger modellen trenes på hele datasettet","The number of times the model is trained on the whole dataset"],["Antall treningsdatapunkter som brukes per iterasjon av treningen","The number of training points used per training iteration"],["Antall features som brukes i treningen","The number of features used in training"]],
 a:2,w:["Én iterasjon = én parameteroppdatering basert på én batch. Alternativ 2 er antall epoker.","One iteration = one parameter update based on one batch. Option 2 is the number of epochs."]},
{id:"e24-14",t:1,s:"e24",
 q:["Du har 10 000 treningspunkter og batch size 500. Hvor mange iterasjoner er det i én epoke?","You have 10,000 training points and a batch size of 500. How many iterations are there in one epoch?"],
 o:[["20","20"],["50","50"],["100","100"],["5","5"]],
 a:0,w:["10 000 / 500 = 20 batcher per gjennomgang av datasettet.","10,000 / 500 = 20 batches per pass over the data."]},
{id:"e24-20",t:1,s:"e24",
 q:["I hvilket tilfelle vet vi at gradient descent (med passende læringsrate) vil finne et globalt minimum?","In which case do we know gradient descent (with a suitable learning rate) will find a global minimum?"],
 o:[["Lineær regresjon","Linear regression"],["Konvekse funksjoner","Convex functions"],["Nevrale nettverk","Neural networks"],["Monotone funksjoner","Monotone functions"]],
 a:1,w:["En konveks funksjon har ingen lokale minima utenom det globale. Nevrale nettverk har ikke-konvekse tapsflater.","A convex function has no local minima besides the global one. Neural networks have non-convex loss surfaces."]},
{id:"e25-10.2",t:1,s:"e25",
 c:"import numpy as np\nz = np.matmul(X, w)\ny_pred = 1 / (1 + np.exp(-z))",
 q:["X har shape (n_samples, n_features) og w har shape (n_features,). Hva inneholder y_pred etter at koden over er kjørt?",
    "X has shape (n_samples, n_features) and w has shape (n_features,). What does y_pred contain after running the code above?"],
 o:[["For hvert sample en score som kan anta hvilken som helst reell verdi","For each sample a score that can take any real value"],["Logaritmen av de predikerte sannsynlighetene for hvert sample","The log of the predicted probabilities for each sample"],["Predikerte sannsynligheter i intervallet (0, 1) for hvert sample","Predicted probabilities in (0, 1) for each sample"],["Klasse-labels 0 eller 1 for hvert sample","Class labels 0 or 1 for each sample"]],
 a:2,w:["z er reelle scorer (logits). Sigmoid gjør dem til sannsynligheter. Labels får du først med en terskel.","z holds real scores (logits). The sigmoid turns them into probabilities. You only get labels after applying a threshold."]},
{id:"n-1.1",t:1,s:"notes",
 q:["Hva er typiske konsekvenser av å bruke for <b>liten</b> batch size under trening?","What is a typical consequence of using a batch size that is too <b>small</b> during training?"],
 o:[["Det blir mer støy i gradientene","The gradients become noisier"],["Hver treningsepoke tar mindre tid","Each epoch takes less time"],["Det blir mindre støy i gradientene","The gradients become less noisy"],["Modellen overtilpasser","The model overfits"]],
 a:0,w:["Få punkter per gradientestimat gir et støyete estimat av den sanne gradienten.","Few points per gradient estimate give a noisy estimate of the true gradient."]},
{id:"p-1.1",t:1,s:"new",
 q:["Logistisk regresjon med terskel 0.5: hvordan ser beslutningsgrensen ut i feature-rommet?","Logistic regression with threshold 0.5: what does the decision boundary look like in feature space?"],
 o:[["En sirkel rundt den positive klassen","A circle around the positive class"],["Et hyperplan (en rett linje i 2D) der wᵀx + b = 0","A hyperplane (a straight line in 2D) where wᵀx + b = 0"],["En S-formet kurve","An S-shaped curve"],["Den kan ha vilkårlig form","It can have any shape"]],
 a:1,w:["σ(z) = 0.5 ⇔ z = 0, og wᵀx + b = 0 er lineært i x. S-formen er sigmoiden i z, ikke grensen.","σ(z) = 0.5 ⇔ z = 0, and wᵀx + b = 0 is linear in x. The S-shape is the sigmoid of z, not the boundary."]},
{id:"p-1.2",t:1,s:"new",
 q:["Hvor kommer cross entropy-tapet for logistisk regresjon fra?","Where does the cross entropy loss for logistic regression come from?"],
 o:[["Det er valgt fordi det er raskere enn MSE","It was chosen because it is faster than MSE"],["Fra å maksimere (log-)likelihooden til en Bernoulli-modell for targets","From maximising the (log-)likelihood of a Bernoulli model for the targets"],["Fra Bayes' teorem med uniform prior","From Bayes' theorem with a uniform prior"],["Fra Gini-urenhet","From Gini impurity"]],
 a:1,w:["p(y|x) = ŷ<sup>y</sup>(1−ŷ)<sup>1−y</sup>. Negativ log-likelihood av dette er binary cross entropy.","p(y|x) = ŷ<sup>y</sup>(1−ŷ)<sup>1−y</sup>. Its negative log-likelihood is binary cross entropy."]},
{id:"p-1.3",t:1,s:"new",
 q:["Trenings-losset synker, men <b>ekstremt sakte</b>, og er langt fra konvergert etter mange epoker. Hva er mest sannsynlig?",
    "The training loss decreases, but <b>extremely slowly</b>, and is far from converged after many epochs. What is most likely?"],
 o:[["Læringsraten er for lav","The learning rate is too low"],["Læringsraten er for høy","The learning rate is too high"],["Modellen overtilpasser","The model is overfitting"],["Batch size er 1","The batch size is 1"]],
 a:0,w:["Små steg betyr at vi beveger oss mot minimum, men veldig sakte.","Small steps mean we move towards the minimum, but very slowly."]}
);

// ===== Topic 2: Classification metrics =====
QB.push(
{id:"e24-5a",t:2,s:"e24",fig:"roc",fixed:true,
 q:["Confusion matrix ved terskel <b>0.3</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>40</td><td>10</td></tr><tr><th>Label −</th><td>30</td><td>20</td></tr></table>Hvilket punkt på ROC-kurven tilsvarer terskel 0.3?",
    "Confusion matrix at threshold <b>0.3</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>40</td><td>10</td></tr><tr><th>Label −</th><td>30</td><td>20</td></tr></table>Which point on the ROC curve corresponds to threshold 0.3?"],
 o:[["Punkt 1","Point 1"],["Punkt 2","Point 2"],["Punkt 3","Point 3"],["Punkt 4","Point 4"],["Punkt 5","Point 5"]],
 a:3,w:["TPR = 40/50 = 0.8 og FPR = 30/50 = 0.6 gir punktet (0.6, 0.8), som er punkt 4.","TPR = 40/50 = 0.8 and FPR = 30/50 = 0.6 give the point (0.6, 0.8), which is point 4."]},
{id:"e24-5b",t:2,s:"e24",fig:"roc",fixed:true,
 q:["Confusion matrix ved terskel <b>0.7</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>25</td><td>25</td></tr><tr><th>Label −</th><td>10</td><td>40</td></tr></table>Hvilket punkt på ROC-kurven tilsvarer terskel 0.7?",
    "Confusion matrix at threshold <b>0.7</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>25</td><td>25</td></tr><tr><th>Label −</th><td>10</td><td>40</td></tr></table>Which point on the ROC curve corresponds to threshold 0.7?"],
 o:[["Punkt 1","Point 1"],["Punkt 2","Point 2"],["Punkt 3","Point 3"],["Punkt 4","Point 4"],["Punkt 5","Point 5"]],
 a:1,w:["TPR = 25/50 = 0.5 og FPR = 10/50 = 0.2 gir punktet (0.2, 0.5), som er punkt 2.","TPR = 25/50 = 0.5 and FPR = 10/50 = 0.2 give the point (0.2, 0.5), which is point 2."]},
{id:"e24-5c",t:2,s:"e24",fig:"roc",
 q:["Se på ROC-kurven. Hva svarer punkt 5 til?","Look at the ROC curve. What does point 5 correspond to?"],
 o:[["Den laveste klassifiseringsterskelen av punktene 1–5","The lowest classification threshold of points 1–5"],["En terskel som gir høy presisjon","A threshold that gives high precision"],["Den høyeste klassifiseringsterskelen av punktene 1–5","The highest classification threshold of points 1–5"],["Det er ikke mulig å si uten å vite terskelen","Impossible to say without knowing the threshold"]],
 a:0,w:["Lavere terskel gir flere positive prediksjoner, altså både høyere TPR og høyere FPR (opp og til høyre).","A lower threshold gives more positive predictions, so both TPR and FPR rise (up and to the right)."]},
{id:"e24-6",t:2,s:"e24",
 q:["Hva betyr det at en modell har ROC AUC = 0.9?","What does it mean that a model has ROC AUC = 0.9?"],
 o:[["Modellen predikerer riktig klasse i 90 % av tilfellene","The model predicts the right class 90% of the time"],["Modellen har 90 % sannsynlighet for å predikere positive riktig for enhver terskel","The model has a 90% chance of predicting positives correctly at any threshold"],["Det er 90 % sannsynlighet for at modellen rangerer et tilfeldig positivt tilfelle høyere enn et tilfeldig negativt","There is a 90% probability the model ranks a random positive higher than a random negative"],["Modellen har 90 % accuracy ved terskel 0.5","The model has 90% accuracy at threshold 0.5"]],
 a:2,w:["AUC er en rangeringsmetrikk uavhengig av terskel, ikke accuracy.","AUC is a threshold-independent ranking metric, not accuracy."]},
{id:"e24-7a",t:2,s:"e24",
 q:["En modell skal finne pasienter med en sjelden, dødelig sykdom. Det er alvorlig med mange <b>falske negative</b>. Hvilken metrikk er viktigst?",
    "A model must find patients with a rare, deadly disease. Many <b>false negatives</b> are serious. Which metric matters most?"],
 o:[["Accuracy","Accuracy"],["Recall = TP / (TP + FN)","Recall = TP / (TP + FN)"],["Precision = TP / (TP + FP)","Precision = TP / (TP + FP)"]],
 a:1,w:["Recall straffer FN direkte: andelen syke vi faktisk finner.","Recall penalises FN directly: the share of sick patients we actually catch."]},
{id:"e24-7b",t:2,s:"e24",
 q:["Sykdomsmodellen har høy accuracy, men sykehuset vil likevel ikke kjøpe den. Du studerte ikke fordelingen i treningsdataene og brukte ikke valideringsdata. Hva har sannsynligvis gått galt?",
    "The disease model has high accuracy, yet the hospital won't buy it. You never looked at the training data distribution or used validation data. What most likely went wrong?"],
 o:[["Fordelingen mellom friske og syke i treningsdataene er ubalansert","The healthy/sick distribution in the training data is imbalanced"],["Læringsraten er for lav, og uten valideringsdata ble hyperparametrene ikke sjekket","The learning rate is too low and, without validation data, hyperparameters were not checked"],["Modellen overtilpasset pasienter fra dette sykehuset","The model overfit to patients from this particular hospital"],["Cross entropy bør bare brukes til lineær modellering","Cross entropy should only be used for linear modelling"]],
 a:0,w:["Sjelden sykdom: å predikere «frisk» for alle gir høy accuracy, men null recall.","Rare disease: predicting 'healthy' for everyone gives high accuracy but zero recall."]},
{id:"e24-7c",t:2,s:"e24",
 q:["Politiet vil bruke en modell til å avgjøre om meldinger er verdt en kostbar utrykning. Det er viktig å unngå mange <b>falske positive</b>. Hvilken metrikk er viktigst?",
    "The police want a model to decide whether messages justify an expensive call-out. Avoiding many <b>false positives</b> is important. Which metric matters most?"],
 o:[["Specificity = TN / (TN + FP)","Specificity = TN / (TN + FP)"],["Recall = TP / (TP + FN)","Recall = TP / (TP + FN)"],["Precision = TP / (TP + FP)","Precision = TP / (TP + FP)"]],
 a:2,w:["Precision forteller hvor mange av utrykningene (positive prediksjoner) som faktisk var verdt det.","Precision tells how many of the call-outs (positive predictions) were actually worth it."]},
{id:"n-2.1",t:2,s:"notes",
 q:["Hva representerer diagonalen (0,0)–(1,1) på en ROC-kurve?","What does the diagonal (0,0)–(1,1) on a ROC curve represent?"],
 o:[["En klassifiseringsmodell som ikke er bedre enn tilfeldig gjetning","A classifier no better than random guessing"],["En modell som i snitt predikerer 0.5 for alle dataene","A model that predicts 0.5 on average for all the data"],["En klassifiseringsterskel på 0.5","A classification threshold of 0.5"],["En middels god modell vi bør ligge over","A moderately good model we should beat"]],
 a:0,w:["Tilfeldig gjetning gir TPR = FPR for alle terskler, og dermed AUC = 0.5.","Random guessing gives TPR = FPR at every threshold, so AUC = 0.5."]},
{id:"n-2.2",t:2,s:"notes",
 q:["Hvilket av følgende er <b>ikke</b> en korrekt tolkning av ROC AUC?","Which of the following is <b>not</b> a correct interpretation of ROC AUC?"],
 o:[["Høy ROC AUC indikerer god evne til å skille klassene over ulike terskler","A high ROC AUC indicates good class separation across thresholds"],["ROC AUC gir sannsynligheten for at et positivt eksempel rangeres høyere enn et negativt","ROC AUC gives the probability a positive is ranked above a negative"],["Lav ROC AUC betyr at modellen har lav presisjon","A low ROC AUC means the model has low precision"],["ROC AUC = 0.5 betyr at modellen gjetter tilfeldig","ROC AUC = 0.5 means the model guesses randomly"]],
 a:2,w:["ROC bygger på TPR og FPR, ikke presisjon. Presisjon er en egen kurve (precision–recall).","ROC is built from TPR and FPR, not precision. Precision has its own curve (precision–recall)."]},
{id:"p-2.1",t:2,s:"new",
 q:["Med TP = 40, FP = 30, FN = 10, TN = 20: hva er <b>precision</b>?","With TP = 40, FP = 30, FN = 10, TN = 20: what is the <b>precision</b>?"],
 o:[["0.80","0.80"],["0.57","0.57"],["0.60","0.60"],["0.40","0.40"]],
 a:1,w:["Precision = 40 / (40 + 30) ≈ 0.57. (Recall ville vært 40/50 = 0.80.)","Precision = 40 / (40 + 30) ≈ 0.57. (Recall would be 40/50 = 0.80.)"]},
{id:"p-2.2",t:2,s:"new",
 q:["Du <b>øker</b> klassifiseringsterskelen fra 0.5 til 0.9. Hva skjer typisk?","You <b>raise</b> the classification threshold from 0.5 to 0.9. What typically happens?"],
 o:[["Recall øker og precision synker","Recall rises and precision falls"],["Precision øker og recall synker","Precision rises and recall falls"],["Både precision og recall øker","Both precision and recall rise"],["ROC AUC endres","ROC AUC changes"]],
 a:1,w:["Færre, men sikrere positive prediksjoner. AUC er uavhengig av terskel.","Fewer but more confident positive predictions. AUC does not depend on the threshold."]},
{id:"p-2.3",t:2,s:"new",
 q:["Hvorfor er accuracy en dårlig metrikk når 99 % av dataene tilhører én klasse?","Why is accuracy a poor metric when 99% of the data belongs to one class?"],
 o:[["Fordi accuracy ikke kan beregnes for ubalanserte data","Because accuracy cannot be computed for imbalanced data"],["Fordi en modell som alltid predikerer majoritetsklassen får 99 % accuracy uten å ha lært noe","Because a model that always predicts the majority class scores 99% without learning anything"],["Fordi accuracy alltid er lavere enn recall","Because accuracy is always lower than recall"],["Fordi accuracy krever en ROC-kurve","Because accuracy needs a ROC curve"]],
 a:1,w:["Bruk heller recall, precision, ROC AUC eller precision–recall-kurver.","Use recall, precision, ROC AUC or precision–recall curves instead."]},
{id:"p-2.4",t:2,s:"new",
 q:["Hva er true positive rate (TPR) og false positive rate (FPR), som utgjør aksene i en ROC-kurve?","What are the true positive rate (TPR) and false positive rate (FPR), the axes of a ROC curve?"],
 o:[["TPR = TP/(TP+FP), FPR = FP/(FP+TP)","TPR = TP/(TP+FP), FPR = FP/(FP+TP)"],["TPR = TP/(TP+FN), FPR = FP/(FP+TN)","TPR = TP/(TP+FN), FPR = FP/(FP+TN)"],["TPR = TN/(TN+FP), FPR = FN/(FN+TP)","TPR = TN/(TN+FP), FPR = FN/(FN+TP)"],["TPR = TP/N, FPR = FP/N","TPR = TP/N, FPR = FP/N"]],
 a:1,w:["TPR = recall. FPR = 1 − specificity: andelen negative som feilaktig blir flagget.","TPR = recall. FPR = 1 − specificity: the share of negatives wrongly flagged."]}
);
