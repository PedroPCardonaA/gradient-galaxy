{id:"e25-9.1",t:9,s:"e25",
 q:["Hva er hovedgrunnen til at et <i>target network</i> brukes i DQN?","What is the main reason a <i>target network</i> is used in DQN?"],
 o:[["Å legge til tilfeldig støy i valgt handling slik at agenten alltid utforsker","To add random noise to the chosen action so the agent always explores"],
    ["Å holde Q-verdiene som brukes som treningsmål stabile under læring","To keep the Q-values used as training targets stable during learning"],
    ["Å garantere at nettverket aldri overtilpasser replay-bufferet","To guarantee the network never overfits the replay buffer"],
    ["Å la agenten beregne neste handling uten å bruke policyen","To let the agent compute its next action without the policy"]],
 a:1,w:["Uten target network jager nettverket et mål som flytter seg ved hver oppdatering. Kopien oppdateres sjeldnere.","Without a target network the network chases a target that moves with every update. The copy is updated less often."]},
{id:"e25-9.2",t:9,s:"e25",
 q:["I DQN lagres overganger (state, action, reward, next_state, done) i en replay buffer, og minibatcher samples under trening. Hvilket problem adresserer dette primært?",
    "In DQN, transitions (state, action, reward, next_state, done) are stored in a replay buffer and minibatches are sampled during training. Which problem does this mainly address?"],
 o:[["Treningseksemplene blir mindre korrelerte, så nettverket ikke overtilpasser de nyeste erfaringene","Training samples become less correlated, so the network doesn't overfit to the latest experiences"],
    ["Det forhindrer catastrophic forgetting ved at nettverket aldri ser gamle overganger igjen","It prevents catastrophic forgetting by never showing old transitions again"],
    ["Det garanterer at hvert state–action-par samples like mange ganger","It guarantees every state–action pair is sampled equally often"],
    ["Det gjør utforskning unødvendig","It makes exploration unnecessary"]],
 a:0,w:["Påfølgende steg i en episode er sterkt korrelerte. Tilfeldig sampling bryter korrelasjonen og gjenbruker gamle erfaringer.","Consecutive steps in an episode are highly correlated. Random sampling breaks that correlation and reuses old experience."]},
{id:"e25-9.3",t:9,s:"e25",
 q:["Tradisjonell Q-learning bruker en Q-tabell, mens DQN bruker et nevralt nettverk. Hvilken utfordring oppstår med nettverket?","Classic Q-learning uses a Q-table while DQN uses a neural network. Which challenge arises with the network?"],
 o:[["Nettverket fjerner behovet for en diskonteringsfaktor γ","The network removes the need for a discount factor γ"],
    ["Nettverket tvinger policyen til å bli deterministisk","The network forces the policy to be deterministic"],
    ["Nettverket kan ikke representere Q-verdier for mer enn én handling om gangen","The network cannot represent Q-values for more than one action at a time"],
    ["Å oppdatere én Q-verdi endrer også mange andre Q-verdier på grunn av vektdeling","Updating one Q-value also changes many others because weights are shared"]],
 a:3,w:["I en tabell er hver celle uavhengig. I et nettverk deler alle Q-verdier de samme vektene.","In a table each cell is independent. In a network all Q-values share the same weights."]},
{id:"e25-9.4",t:9,s:"e25",
 q:["En agent oppdager en atferd som gir svært høy belønning, men som tydeligvis ikke er det designeren mente. Hvorfor skjer dette?","An agent finds behaviour that gives very high reward but is clearly not what the designer intended. Why does this happen?"],
 o:[["Agenten kan bare lære av umiddelbare belønninger","The agent can only learn from immediate rewards"],
    ["Agenten utnytter utilsiktede svakheter i hvordan belønningen er definert","The agent exploits unintended weaknesses in how the reward is defined"],
    ["Agenten kan ikke håndtere flere mål samtidig","The agent cannot handle more than one goal"],
    ["Oppdateringsregelen fjerner innflytelsen fra fremtidige belønninger","The update rule removes the influence of future rewards"]],
 a:1,w:["Dette er <i>reward hacking</i>: agenten optimerer det vi skrev, ikke det vi mente.","This is <i>reward hacking</i>: the agent optimises what we wrote, not what we meant."]},
{id:"e25-10.4",t:9,s:"e25",
 c:"buffer = [...]  # liste med transisjoner / list of transitions",
 q:["Du har en replay buffer lagret som en Python-liste med transisjoner. Hvilken funksjon brukes for å trekke en tilfeldig minibatch på 32?","Your replay buffer is a Python list of transitions. Which function draws a random minibatch of 32?"],
 o:[["<code>np.take(buffer, 32)</code>","<code>np.take(buffer, 32)</code>"],["<code>buffer.sort()</code>","<code>buffer.sort()</code>"],["<code>random.sample(buffer, k=32)</code>","<code>random.sample(buffer, k=32)</code>"],["<code>buffer[:32]</code>","<code>buffer[:32]</code>"]],
 a:2,w:["<code>random.sample</code> trekker k unike elementer tilfeldig. <code>buffer[:32]</code> gir de 32 første, som er korrelerte.","<code>random.sample</code> draws k unique random elements. <code>buffer[:32]</code> gives the first 32, which are correlated."]},
{id:"e24-31",t:9,s:"e24",
 q:["Hva er en policy i reinforcement learning?","What is a policy in reinforcement learning?"],
 o:[["En funksjon som gir en verdi for hvert tilstand–handling-par","A function giving a value for every state–action pair"],["Et mål som agenten prøver å maksimere over tid","A goal the agent tries to maximise over time"],["Et estimat av kvaliteten på en handling basert på umiddelbar belønning","An estimate of an action's quality based on immediate reward"],["En strategi som bestemmer hvilken handling agenten skal ta i en gitt tilstand","A strategy that decides which action the agent takes in a given state"]],
 a:3,w:["Alternativ 1 er Q-funksjonen. Policyen er selve beslutningsregelen.","Option 1 is the Q-function. The policy is the decision rule itself."]},
{id:"e24-32",t:9,s:"e24",
 q:["Bellman-oppdateringen er Q<sup>new</sup>(S<sub>t</sub>,A<sub>t</sub>) ← (1−α)·Q(S<sub>t</sub>,A<sub>t</sub>) + α·(R<sub>t+1</sub> + γ·max<sub>A</sub> Q(S<sub>t+1</sub>,A)). Hva medfører en <b>høy</b> verdi av γ?",
    "The Bellman update is Q<sup>new</sup>(S<sub>t</sub>,A<sub>t</sub>) ← (1−α)·Q(S<sub>t</sub>,A<sub>t</sub>) + α·(R<sub>t+1</sub> + γ·max<sub>A</sub> Q(S<sub>t+1</sub>,A)). What does a <b>high</b> value of γ lead to?"],
 o:[["Læringen blir sårbar for catastrophic forgetting","Learning becomes vulnerable to catastrophic forgetting"],["Læringen av Q-verdier domineres av estimatet av fremtidige tilstander","Learning of Q-values is dominated by the estimate of future states"],["Læringen domineres av den umiddelbare rewarden","Learning is dominated by the immediate reward"],["Læringen domineres av de gamle Q-verdiene","Learning is dominated by the old Q-values"]],
 a:1,w:["Stor γ vekter max Q(S<sub>t+1</sub>, A) tungt. Gamle Q-verdier styres av α, ikke γ.","A large γ weights max Q(S<sub>t+1</sub>, A) heavily. The weight on old Q-values is controlled by α, not γ."]},
{id:"e24-33",t:9,s:"e24",
 q:["Hva er forholdet mellom tapet (loss) under trening i Q-learning og rewarden agenten mottar fra miljøet?","What is the relationship between the training loss in Q-learning and the reward the agent gets from the environment?"],
 o:[["Loss minker så lenge Q-verdien oppdateres","Loss decreases as long as the Q-value is updated"],["Reward kan ikke øke uten at loss minker","Reward cannot increase unless loss decreases"],["Loss er det samme som reward med negativt fortegn","Loss equals reward with a negative sign"],["Det er ikke nødvendigvis noen sammenheng mellom loss og reward","There is not necessarily any relationship between loss and reward"]],
 a:3,w:["Loss måler hvor godt nettverket treffer Q-målene, som selv flytter seg. Lavt loss betyr ikke høy reward.","Loss measures how well the network fits the Q-targets, which themselves move. Low loss does not mean high reward."]},
{id:"n-9.1",t:9,s:"notes",
 q:["Hvordan påvirker Markov-egenskapen verdifunksjonen V(s)?","How does the Markov property affect the value function V(s)?"],
 o:[["V(s) avhenger bare av belønningen i nåværende tilstand","V(s) depends only on the reward in the current state"],["V(s) avhenger av hele sekvensen av tidligere tilstander","V(s) depends on the whole sequence of earlier states"],["V(s) avhenger av fremtidige belønninger basert på nåværende tilstand og handlingene som følger","V(s) depends on future rewards based on the current state and the actions that follow"],["V(s) er konstant for alle tilstander","V(s) is constant across all states"]],
 a:2,w:["Verdien er forventet fremtidig (diskontert) belønning fra s. Historien før s spiller ingen rolle.","The value is the expected future (discounted) reward from s. The history before s does not matter."]},
{id:"p-9.1",t:9,s:"new",
 q:["Q(S<sub>t</sub>,A<sub>t</sub>) = 2, α = 0.5, R<sub>t+1</sub> = 1, γ = 0.9 og max<sub>A</sub> Q(S<sub>t+1</sub>,A) = 4. Hva blir Q<sup>new</sup>(S<sub>t</sub>,A<sub>t</sub>)?","Q(S<sub>t</sub>,A<sub>t</sub>) = 2, α = 0.5, R<sub>t+1</sub> = 1, γ = 0.9 and max<sub>A</sub> Q(S<sub>t+1</sub>,A) = 4. What is Q<sup>new</sup>(S<sub>t</sub>,A<sub>t</sub>)?"],
 o:[["2.3","2.3"],["4.6","4.6"],["3.3","3.3"],["3.0","3.0"]],
 a:2,w:["0.5·2 + 0.5·(1 + 0.9·4) = 1 + 0.5·4.6 = 3.3.","0.5·2 + 0.5·(1 + 0.9·4) = 1 + 0.5·4.6 = 3.3."]},
{id:"p-9.2",t:9,s:"new",
 q:["Hva skjer i Bellman-oppdateringen dersom læringsraten α = 0?","What happens in the Bellman update if the learning rate α = 0?"],
 o:[["Q-verdiene endres aldri, så agenten lærer ingenting","The Q-values never change, so the agent learns nothing"],["Den gamle Q-verdien erstattes helt av det nye estimatet","The old Q-value is fully replaced by the new estimate"],["Agenten ignorerer fremtidige belønninger","The agent ignores future rewards"],["Agenten velger bare tilfeldige handlinger","The agent only takes random actions"]],
 a:0,w:["Q<sup>new</sup> = 1·Q + 0·(…) = Q. Med α = 1 skjer det motsatte: den gamle verdien glemmes helt.","Q<sup>new</sup> = 1·Q + 0·(…) = Q. With α = 1 the opposite happens: the old value is forgotten completely."]},
{id:"p-9.3",t:9,s:"new",
 q:["Frozen Lake 4×4 har 16 tilstander og 4 mulige handlinger (opp, ned, venstre, høyre). Hvor mange Q-verdier har Q-tabellen?","Frozen Lake 4×4 has 16 states and 4 possible actions (up, down, left, right). How many Q-values does the Q-table hold?"],
 o:[["16","16"],["20","20"],["64","64"],["256","256"]],
 a:2,w:["Én verdi per (tilstand, handling): 16 × 4 = 64.","One value per (state, action): 16 × 4 = 64."]},
{id:"p-9.4",t:9,s:"new",
 q:["Hvorfor lar man ofte ε <b>avta</b> gjennom treningen i en ε-greedy agent?","Why is ε often <b>decayed</b> during training of an ε-greedy agent?"],
 o:[["For å gjøre Q-tabellen mindre","To make the Q-table smaller"],["Mye utforskning tidlig når Q-estimatene er dårlige, mer utnyttelse senere når de er bedre","Lots of exploration early when Q-estimates are poor, more exploitation later when they are better"],["For å øke diskonteringsfaktoren","To increase the discount factor"],["For å unngå at rewarden blir negativ","To prevent the reward from becoming negative"]],
 a:1,w:["Exploration–exploitation-avveiningen: først lære miljøet å kjenne, så bruke det man har lært.","The exploration–exploitation trade-off: first get to know the environment, then use what was learned."]},
{id:"p-9.5",t:9,s:"new",
 q:["Hva er forskjellen mellom <i>reward</i> og <i>verdi</i> (Q-verdi) i RL?","What is the difference between <i>reward</i> and <i>value</i> (Q-value) in RL?"],
 o:[["Reward gis av miljøet som umiddelbar tilbakemelding, mens Q-verdien må læres og inkluderer forventet fremtidig verdi","The environment gives reward as immediate feedback, while the Q-value must be learned and includes expected future value"],["De er det samme","They are the same thing"],["Q-verdien gis av miljøet, mens reward må læres","The environment gives the Q-value, while reward must be learned"],["Reward gjelder bare for terminaltilstander","Reward only exists in terminal states"]],
 a:0,w:["Reward er gitt, verdien er et lært estimat av langsiktige konsekvenser.","Reward is given; value is a learned estimate of long-term consequences."]},
{id:"p-9.6",t:9,s:"new",
 c:"state, reward, done, info = env.step(action)",
 q:["Hva gjør <code>env.step(action)</code> i et Gym-lignende miljø?","What does <code>env.step(action)</code> do in a Gym-style environment?"],
 o:[["Nullstiller miljøet til starttilstanden","Resets the environment to its start state"],["Oppdaterer Q-tabellen","Updates the Q-table"],["Velger den beste handlingen for agenten","Picks the best action for the agent"],["Utfører handlingen og returnerer ny tilstand, reward, om episoden er ferdig (done) og ekstra info","Executes the action and returns the new state, the reward, whether the episode is done, and extra info"]],
 a:3,w:["Miljøet gir tilstander og rewards. Det er agenten som lærer og velger. <code>env.reset()</code> gir starttilstanden.","The environment provides states and rewards; the agent does the learning and choosing. <code>env.reset()</code> gives the start state."]}
);

QB.push(
{id:"e24-34",t:10,s:"e24",
 q:["Hvilket utsagn er korrekt om LIME?","Which statement about LIME is correct?"],
 o:[["LIME produserer globale feature importances for enhver modell","LIME produces global feature importances for any model"],["LIME tilpasser en tolkbar modell i nabolaget rundt et enkelt datapunkt","LIME fits an interpretable model in the neighbourhood of a single data point"],["LIME minimerer kompleksiteten til enhver modell slik at den kan tolkes direkte","LIME reduces the complexity of any model so it can be read directly"],["LIME brukes til å erstatte nevrale nettverk med beslutningstrær","LIME is used to replace neural networks with decision trees"]],
 a:1,w:["LIME = Local Interpretable Model-agnostic Explanations: en lokal surrogatmodell g rundt x.","LIME = Local Interpretable Model-agnostic Explanations: a local surrogate model g around x."]},
{id:"e24-35a",t:10,s:"e24",fig:"shap",
 q:["Se på SHAP-plottet (beeswarm, Titanic). Hvilken feature påvirker modellprediksjonen mest?","Look at the SHAP plot (beeswarm, Titanic). Which feature influences the model prediction most?"],
 o:[["Embarked_S","Embarked_S"],["Pclass","Pclass"],["Age","Age"],["Sex","Sex"]],

{id:"e24-35b",t:10,s:"e24",fig:"shap",
 q:["Se på SHAP-plottet. Hvordan påvirker det modellprediksjonen at Pclass har en <b>høy</b> verdi (rød)?","Look at the SHAP plot. How does a <b>high</b> value of Pclass (red) affect the model prediction?"],
 o:[["Den drives opp sammenliknet med gjennomsnittsprediksjonen","It is pushed up relative to the average prediction"],["Den trekkes ned sammenliknet med gjennomsnittsprediksjonen","It is pulled down relative to the average prediction"],["Passasjerer med høy Pclass har ofte lav verdi av Sex","Passengers with high Pclass often have a low value of Sex"],["Den fører alltid til høy prediksjon","It always leads to a high prediction"]],

{id:"e24-36",t:10,s:"e24",
 q:["Shapley-verdi: φ<sub>i</sub>(v) = Σ<sub>S⊆N∖{i}</sub> |S|!(N−|S|−1)!/N! · (v(S∪{i}) − v(S)). Spill med N = 3: v(1)=2, v(2)=4, v(3)=5, v(1,2)=3, v(1,3)=3, v(2,3)=2, v(1,2,3)=3. Hva er Shapley-verdiene?",
    "Shapley value: φ<sub>i</sub>(v) = Σ<sub>S⊆N∖{i}</sub> |S|!(N−|S|−1)!/N! · (v(S∪{i}) − v(S)). Game with N = 3: v(1)=2, v(2)=4, v(3)=5, v(1,2)=3, v(1,3)=3, v(2,3)=2, v(1,2,3)=3. What are the Shapley values?"],
 o:[["φ₁ = 1/2, φ₂ = 1, φ₃ = 2","φ₁ = 1/2, φ₂ = 1, φ₃ = 2"],["φ₁ = 1/2, φ₂ = 3/2, φ₃ = 1/2","φ₁ = 1/2, φ₂ = 3/2, φ₃ = 1/2"],["φ₁ = 1/2, φ₂ = 3/2, φ₃ = 1","φ₁ = 1/2, φ₂ = 3/2, φ₃ = 1"],["φ₁ = 1/2, φ₂ = 1, φ₃ = 3/2","φ₁ = 1/2, φ₂ = 1, φ₃ = 3/2"]],
 a:3,w:["Snarvei via effektivitet: summen må bli v(1,2,3) = 3, og det oppfyller bare 1/2 + 1 + 3/2. φ₁ = ⅓·2 + ⅙·(−1) + ⅙·(−2) + ⅓·1 = 1/2.","Shortcut via efficiency: the sum must be v(1,2,3) = 3, and only 1/2 + 1 + 3/2 does that. φ₁ = ⅓·2 + ⅙·(−1) + ⅙·(−2) + ⅓·1 = 1/2."]},
{id:"n-10.1",t:10,s:"notes",
 q:["Hva gir en <b>global</b> XAI-metode?","What does a <b>global</b> XAI method give?"],
 o:[["En forklaring på hvorfor modellen gjorde en spesifikk prediksjon","An explanation of why the model made one specific prediction"],["En overordnet forklaring på hvordan modellen tar beslutninger på tvers av datasettet","An overall explanation of how the model makes decisions across the dataset"],["En forklaring på hvordan en hvilken som helst modell fungerer, uavhengig av modelltype","An explanation of how any model works, regardless of model type"],["En forklaring samt et mål på hvor treffsikker forklaringen er","An explanation plus a measure of how accurate the explanation is"]],
 a:1,w:["Global = hele modellen. Alternativ 1 er lokal, og alternativ 3 beskriver modellagnostisk.","Global = the whole model. Option 1 is local, and option 3 describes model-agnostic."]},
{id:"p-10.1",t:10,s:"new",
 q:["Hva er forskjellen mellom <i>tolkbarhet</i> (interpretability) og <i>forklarbarhet</i> (explainability) i notatene?","What is the difference between <i>interpretability</i> and <i>explainability</i> in the course notes?"],
 o:[["Tolkbarhet er en passiv egenskap (modellen gir direkte mening), forklarbarhet er aktiv (vi legger til en metode som forklarer)","Interpretability is passive (the model makes sense directly); explainability is active (we add a method that explains)"],["De betyr nøyaktig det samme","They mean exactly the same"],["Tolkbarhet gjelder nevrale nettverk, forklarbarhet gjelder lineære modeller","Interpretability is for neural networks, explainability for linear models"],["Forklarbarhet betyr at alle parametre kan printes","Explainability means all parameters can be printed"]],
 a:0,w:["En lineær regresjon er tolkbar. Et nevralt nettverk er transparent (kan printes), men ikke tolkbart, og trenger forklaring.","A linear regression is interpretable. A neural network is transparent (it can be printed) but not interpretable, so it needs explaining."]},
{id:"p-10.2",t:10,s:"new",
 q:["Hva betyr det at en forklaringsmetode er <i>post-hoc</i>?","What does it mean that an explanation method is <i>post-hoc</i>?"],
 o:[["Den brukes bare på bildemodeller","It only works on image models"],["Den er innebygd i modellarkitekturen","It is built into the model architecture"],["Forklaringen genereres på en ferdigtrent modell","The explanation is generated for an already-trained model"],["Den forklarer bare feilprediksjoner","It only explains wrong predictions"]],
 a:2,w:["SHAP, LIME og konseptdeteksjon er alle post-hoc i kurset.","SHAP, LIME and concept detection are all post-hoc in this course."]},
{id:"p-10.3",t:10,s:"new",
 q:["Hva betyr <i>modellagnostisk</i>?","What does <i>model-agnostic</i> mean?"],
 o:[["Metoden trenger tilgang til modellens gradienter","The method needs access to the model's gradients"],["Metoden trenger bare å gi modellen input og lese output, så den kan brukes på enhver modell","The method only needs to feed input and read output, so it works on any model"],["Metoden fungerer bare på trebaserte modeller","The method only works on tree-based models"],["Metoden forklarer bare én feature","The method explains only one feature"]],
 a:1,w:["Eksempler: KernelSHAP og LIME. Konseptdeteksjon (CAV/TCAV) er modellspesifikk fordi den bruker interne aktiveringer.","Examples: KernelSHAP and LIME. Concept detection (CAV/TCAV) is model-specific because it uses internal activations."]},
{id:"p-10.4",t:10,s:"new",
 q:["SHAP skriver en prediksjon som f(x*) = φ₀ + Σ<sub>j</sub> φ<sub>j</sub>. Hva er φ₀, og hvilket aksiom sørger for at likheten holder?","SHAP writes a prediction as f(x*) = φ₀ + Σ<sub>j</sub> φ<sub>j</sub>. What is φ₀, and which axiom makes the equality hold?"],
 o:[["φ₀ er den største SHAP-verdien; symmetri","φ₀ is the largest SHAP value; symmetry"],["φ₀ er bias-vekten i modellen; additivitet","φ₀ is the model's bias weight; additivity"],["φ₀ er antall features; nullspiller","φ₀ is the number of features; null player"],["φ₀ er forventet (gjennomsnittlig) prediksjon over bakgrunnsdata; effektivitet","φ₀ is the expected (average) prediction over the background data; efficiency"]],

{id:"p-10.7",t:10,s:"new",
 q:["Hva kjennetegner <code>shap.TreeExplainer</code> sammenliknet med <code>shap.KernelExplainer</code>?","What characterises <code>shap.TreeExplainer</code> compared with <code>shap.KernelExplainer</code>?"],

{id:"p-10.8",t:10,s:"new",
 q:["Hvorfor deler Image SHAP bildet inn i <i>superpiksler</i>?","Why does Image SHAP split the image into <i>superpixels</i>?"],
 o:[["For å øke oppløsningen","To increase the resolution"],["Fordi SHAP bare fungerer på gråtonebilder","Because SHAP only works on greyscale images"],["For å trene modellen raskere","To train the model faster"],["Fordi kostnaden vokser eksponentielt med antall features, og enkeltpiksler sjelden er meningsfulle forklaringer","Because cost grows exponentially with the number of features, and single pixels are rarely meaningful explanations"]],
 a:3,w:["Hver pikselgruppe behandles som én spiller, på samme måte som å regne Shapley for grupper av spillere.","Each pixel group is treated as one player, just like computing Shapley values for groups of players."]},
{id:"p-10.9",t:10,s:"new",
 q:["LIME minimerer L(f, g, π<sub>x</sub>) + Ω(g). Hva er avveiningen mellom de to leddene?","LIME minimises L(f, g, π<sub>x</sub>) + Ω(g). What trade-off do the two terms express?"],
 o:[["Hvor godt g etterlikner f lokalt mot hvor enkel (tolkbar) g er","How well g mimics f locally versus how simple (interpretable) g is"],["Treningsfeil mot testfeil","Training error versus test error"],["Bias mot varians i f","Bias versus variance of f"],["Precision mot recall","Precision versus recall"]],
 a:0,w:["L måler lokal troskap (vektet med nabolaget π<sub>x</sub>), Ω straffer kompleksitet, f.eks. antall features eller tredybde.","L measures local fidelity (weighted by the neighbourhood π<sub>x</sub>); Ω penalises complexity, e.g. number of features or tree depth."]},
{id:"p-10.10",t:10,s:"new",
 q:["Hvilke labels bruker LIME når surrogatmodellen g tilpasses på de samplede nabopunktene x<sub>i</sub>?","Which labels does LIME use when fitting the surrogate g on the sampled neighbour points x<sub>i</sub>?"],
 o:[["De sanne targetverdiene fra treningsdataene","The true target values from the training data"],["Tilfeldige labels","Random labels"],["Prediksjonene f(x<sub>i</sub>) fra modellen som skal forklares","The predictions f(x<sub>i</sub>) of the model being explained"],["Labels fra et bakgrunnsdatasett","Labels from a background dataset"]],
 a:2,w:["Poenget er at g skal etterlikne f, ikke dataene.","The point is that g should mimic f, not the data."]},
{id:"p-10.11",t:10,s:"new",
 q:["Du kjører LIME to ganger på samme datapunkt og får litt ulike forklaringer. Hvorfor?","You run LIME twice on the same data point and get slightly different explanations. Why?"],
 o:[["Modellen f endrer seg mellom kjøringene","The model f changes between runs"],["Nabolagspunktene samples tilfeldig, så surrogaten blir litt ulik hver gang","The neighbourhood points are sampled randomly, so the surrogate differs a little each time"],["LIME er en global metode","LIME is a global method"],["Datapunktet blir normalisert på nytt","The data point is re-normalised"]],
 a:1,w:["LIME gir ingen formell garanti for at g er en god surrogat, så kvaliteten må sjekkes empirisk.","LIME gives no formal guarantee that g is a good surrogate, so its quality must be checked empirically."]},
{id:"p-10.12",t:10,s:"new",
 q:["Hvordan finner man en konseptaktiveringsvektor (CAV) for konseptet C i lag l?","How do you find a concept activation vector (CAV) for concept C in layer l?"],
 o:[["Ved å ta gjennomsnittet av alle vekter i lag l","By averaging all the weights in layer l"],["Ved å kjøre PCA på input-bildene","By running PCA on the input images"],["Ved å beregne SHAP-verdier for konseptbildene","By computing SHAP values for the concept images"],["Ved å trene en lineær probe som skiller aktiveringene for konseptdata fra tilfeldige data; CAV er normalvektoren til beslutningsflaten","By training a linear probe to separate activations of concept data from random data; the CAV is the normal vector of its decision boundary"]],
 a:3,w:["Høy treffsikkerhet for proben betyr at konseptet er (lineært) representert i laget.","High probe accuracy means the concept is (linearly) represented in that layer."]},
{id:"p-10.13",t:10,s:"new",
 q:["TCAV-skåren for konseptet «prikkete» og klassen «dalmatiner» er 0.8. Hva betyr det, og er TCAV lokal eller global?","The TCAV score for the concept 'dotted' and the class 'dalmatian' is 0.8. What does that mean, and is TCAV local or global?"],
 o:[["80 % av dalmatiner-inputene har positiv sensitivitet mot konseptet; global","80% of the dalmatian inputs have positive sensitivity to the concept; global"],["Modellen er 80 % sikker på at ett bilde er prikkete; lokal","The model is 80% sure one image is dotted; local"],["Konseptet forklarer 80 % av variansen; global","The concept explains 80% of the variance; global"],["Proben har 80 % accuracy; lokal","The probe has 80% accuracy; local"]],
 a:0,w:["TCAV teller andelen inputs i klassen der den retningsderiverte langs CAV er positiv. Den oppsummerer en hel klasse, så den er global.","TCAV counts the share of class inputs whose directional derivative along the CAV is positive. It summarises a whole class, so it is global."]},
{id:"p-10.14",t:10,s:"new",
 q:["Data processing inequality for X → Z₁ → Z₂ (lag i et nettverk) sier at I(X; Z₂) ≤ I(X; Z₁). Hva betyr dette?","The data processing inequality for X → Z₁ → Z₂ (layers in a network) says I(X; Z₂) ≤ I(X; Z₁). What does this mean?"],
 o:[["Senere lag inneholder alltid strengt mindre informasjon","Later layers always contain strictly less information"],["Et lag kan aldri inneholde mer informasjon om input enn tidligere lag","A layer can never contain more information about the input than earlier layers"],["Dypere nettverk generaliserer alltid bedre","Deeper networks always generalise better"],["Gjensidig informasjon øker gjennom nettverket","Mutual information increases through the network"]],
 a:1,w:["Teoremet garanterer bare at informasjonen ikke <i>øker</i>. Det sier ikke at den garantert avtar.","The theorem only guarantees information does not <i>increase</i>. It does not say it must decrease."]}
);

// ===== Topic 11: Law & ethics =====
QB.push(
{id:"e24-37",t:11,s:"e24",
 q:["Hvilket utsagn om AI Act er sant?","Which statement about the AI Act is true?"],
 o:[["AI-systemer med høy samfunnsrisiko blir forbudt","AI systems with high societal risk are banned"],["AI Act regulerer AI-systemer basert på samfunnsrisiko","The AI Act regulates AI systems based on societal risk"],["AI-systemer i helsesektoren har en egen kategori","AI systems in the health sector have their own category"],["AI Act gjelder bare selskaper med hovedsete i EU","The AI Act only applies to companies headquartered in the EU"]],
 a:1,w:["Risikobasert: uakseptabel risiko er forbudt, høy risiko får strenge krav, begrenset risiko får transparenskrav. Den gjelder alle som tilbyr AI i EU (Art. 2).","Risk-based: unacceptable risk is banned, high risk gets strict requirements, limited risk gets transparency duties. It applies to anyone offering AI in the EU (Art. 2)."]},
{id:"e24-38",t:11,s:"e24",
 q:["Hva betyr velgjørenhet (beneficence) som etisk prinsipp for AI?","What does beneficence mean as an ethical principle for AI?"],
 o:[["AI skal ikke fremme kommersielle mål","AI must not promote commercial goals"],["AI skal være tilgjengelig for alle","AI must be available to everyone"],["AI-systemer skal fremme menneskelig velferd og gjøre godt","AI systems should promote human well-being and do good"],["AI-systemer skal operere uten feil","AI systems must operate without errors"]],
 a:2,w:["Et AI-system som oppfyller prinsippet etterlater samfunnet bedre enn før.","An AI system meeting this principle leaves society better off than before."]},
{id:"e24-39a",t:11,s:"e24",
 q:["Hvordan kan et AI-system bryte med det etiske prinsippet <b>autonomi</b>?","How can an AI system violate the ethical principle of <b>autonomy</b>?"],
 o:[["Ved å gi brukeren full kontroll over sine data","By giving users full control over their data"],["Ved å alltid kreve menneskelig godkjenning før det tar en beslutning","By always requiring human approval before deciding"],["Ved å redusere effektiviteten i en organisasjon","By reducing an organisation's efficiency"],["Ved å tvinge beslutninger på brukeren uten samtykke eller kontroll","By imposing decisions on users without their consent or control"]],
 a:3,w:["Autonomi = selvråderett. Mennesker skal bestemme hva som overlates til maskinen (meta-autonomi).","Autonomy = self-determination. Humans decide what is handed to the machine (meta-autonomy)."]},
{id:"e24-39b",t:11,s:"e24",
 q:["Hvilket av disse er et brudd på autonomiprinsippet?","Which of these violates the autonomy principle?"],
 o:[["Å manipulere brukere uten at de vet at de blir påvirket","Manipulating users without them knowing they are influenced"],["Å la brukeren velge bort AI-baserte anbefalinger","Letting users opt out of AI-based recommendations"],["Å forklare hvordan systemet tar beslutninger","Explaining how the system makes decisions"],["Å la mennesker overstyre systemets output","Letting humans override the system's output"]],
 a:0,w:["Skjult manipulasjon tar fra folk muligheten til informerte valg. Det er også forbudt etter AI Act Art. 5.","Hidden manipulation removes people's ability to make informed choices. It is also banned under AI Act Art. 5."]},
{id:"n-11.1",t:11,s:"notes",
 q:["Et fransk privat selskap lager et bildeanalysesystem som brukes <b>utelukkende</b> av det franske forsvaret. Senere selges det til et belgisk skogbruksselskap som kartlegger skogskader. Hvilket utsagn er riktig?",
    "A French private company builds an image-analysis system used <b>exclusively</b> by the French military. Later it is sold to a Belgian forestry company to map forest damage. Which statement is correct?"],
 o:[["Systemet faller utenfor AI Act også ved salget, fordi det ble utviklet til militære formål","The system stays outside the AI Act after the sale too, since it was built for military use"],["Den militære bruken faller utenfor AI Act, men systemet blir omfattet når det tas i bruk sivilt","The military use is outside the AI Act, but the system is covered once it is used for civilian purposes"],["Den militære bruken er omfattet fordi systemet er utviklet av et privat selskap","The military use is covered because a private company developed it"],["Ingen av bruksområdene er omfattet fordi skogkartlegging ikke er høyrisiko","Neither use is covered because forest mapping isn't high-risk"]],
 a:1,w:["Rene militær-, forsvars- og sikkerhetsformål er unntatt uansett om aktøren er offentlig eller privat, men sivil bruk omfattes.","Purely military, defence and national-security uses are exempt whether the actor is public or private, but civilian use is covered."]},
{id:"n-11.2",t:11,s:"notes",
 q:["Et norsk selskap slipper en GPAI-modell med åpen kildekode og markedsfører den mot virksomheter i EU. Modellen har ikke systemisk risiko. Hva er riktig?",
    "A Norwegian company releases an open-source GPAI model and markets it to businesses in the EU. The model has no systemic risk. What is correct?"],
 o:[["Selskapet har ingen plikter, fordi AI Act ennå ikke gjelder i Norge","The company has no duties, because the AI Act doesn't apply in Norway yet"],["Modellen er unntatt fra alle krav fordi den er åpen kildekode","The model is exempt from all requirements because it is open source"],["Selskapet må publisere et sammendrag av innholdet som er brukt til å trene modellen","The company must publish a summary of the content used to train the model"],["Selskapet må gjennomføre adversarial testing og rapportere hendelser til AI-kontoret","The company must run adversarial testing and report incidents to the AI Office"]],
 a:2,w:["Åpen kildekode fritar fra dokumentasjonskravene, men ikke fra opphavsretts- og sammendragskravene. Adversarial testing gjelder bare systemisk risiko.","Open source exempts it from documentation duties but not from the copyright and training-summary duties. Adversarial testing only applies to systemic-risk models."]},
{id:"p-11.1",t:11,s:"new",
 q:["Et AI-system gir innbyggere en «sosial score» basert på atferd, som fører til urimelig negativ behandling. Hvilken risikokategori i AI Act?","An AI system gives citizens a 'social score' based on behaviour, leading to unjustified negative treatment. Which AI Act risk category?"],
 o:[["Begrenset risiko (transparenskrav)","Limited risk (transparency duties)"],["Høy risiko","High risk"],["Uakseptabel risiko (forbudt)","Unacceptable risk (banned)"],["Minimal risiko","Minimal risk"]],
 a:2,w:["Sosial scoring er blant de forbudte praksisene i Artikkel 5, som har gjeldt siden 2. februar 2025.","Social scoring is among the prohibited practices in Article 5, which has applied since 2 February 2025."]},
{id:"p-11.2",t:11,s:"new",
 q:["Et selskap bruker AI til å sortere jobbsøknader og CV-er ved rekruttering. Hvordan klassifiseres dette i AI Act?","A company uses AI to screen job applications and CVs in recruitment. How is this classified under the AI Act?"],
 o:[["Høyrisikosystem (Anneks 3: arbeidsliv)","High-risk system (Annex 3: employment)"],["Forbudt","Banned"],["Ikke omfattet","Not covered"],["GPAI-modell med systemisk risiko","GPAI model with systemic risk"]],
 a:0,w:["Arbeidsliv (rekruttering, forfremmelse, oppsigelse) står i Anneks 3. Da gjelder Art. 9–15: risikostyring, datastyring, logging, menneskelig tilsyn osv.","Employment (hiring, promotion, dismissal) is listed in Annex 3. Arts. 9–15 then apply: risk management, data governance, logging, human oversight etc."]},
{id:"p-11.3",t:11,s:"new",
 q:["Hva krever Artikkel 50 (transparens) av tilbydere av en chatbot?","What does Article 50 (transparency) require of a chatbot provider?"],
 o:[["At chatboten registreres som høyrisikosystem","That the chatbot is registered as a high-risk system"],["At brukerne får vite at de kommuniserer med et AI-system, med mindre det er åpenbart","That users are told they are interacting with an AI system, unless that is obvious"],["At chatboten forbys","That the chatbot is banned"],["At all kode publiseres som åpen kildekode","That all code is published as open source"]],
 a:1,w:["Begrenset risiko gir transparenskrav. Generativt innhold skal i tillegg merkes maskinlesbart.","Limited risk means transparency duties. Generative output must also be machine-readably marked."]},
{id:"p-11.4",t:11,s:"new",
 q:["Når antas en GPAI-modell å ha <b>systemisk risiko</b> etter Artikkel 51?","When is a GPAI model presumed to have <b>systemic risk</b> under Article 51?"],
 o:[["Når den har mer enn 1 million brukere","When it has more than 1 million users"],["Når den brukes i helsesektoren","When it is used in healthcare"],["Når den er sluppet som åpen kildekode","When it is released as open source"],["Når treningen har brukt mer enn 10<sup>25</sup> flyttallsoperasjoner (FLOP)","When training used more than 10<sup>25</sup> floating-point operations (FLOP)"]],
 a:3,w:["Kommisjonen kan også utpeke modeller etter kriteriene i Anneks 13. Systemisk risiko er ikke det samme som et høyrisikosystem.","The Commission can also designate models via the Annex 13 criteria. Systemic risk is not the same as a high-risk system."]},
{id:"p-11.5",t:11,s:"new",
 q:["Hva er maksimal bot for brudd på forbudene i AI Act?","What is the maximum fine for breaching the AI Act's prohibitions?"],
 o:[["35 millioner euro eller 7 % av global årsomsetning, det som er høyest","€35 million or 7% of global annual turnover, whichever is higher"],["15 millioner euro eller 3 % av global årsomsetning","€15 million or 3% of global annual turnover"],["1 million euro","€1 million"],["20 millioner euro eller 4 % av omsetningen, som i GDPR","€20 million or 4% of turnover, as in GDPR"]],
 a:0,w:["De fleste andre brudd gir inntil 15 mill. euro eller 3 % (Art. 99 og 101).","Most other breaches cost up to €15M or 3% (Arts. 99 and 101)."]},
{id:"p-11.6",t:11,s:"new",
 q:["AI Act er en EU-<i>forordning</i>. Hva innebærer det?","The AI Act is an EU <i>regulation</i>. What does that imply?"],
 o:[["Hvert EU-land må vedta sin egen versjon før den gjelder","Each EU country must adopt its own version before it applies"],["Den er bare en anbefaling","It is only a recommendation"],["Den gjelder direkte i alle EU-land uten nasjonal gjennomføringslov","It applies directly in all EU countries without national implementing law"],["Den gjelder bare offentlig sektor","It only applies to the public sector"]],
 a:2,w:["For Norge (EØS) må den først tas inn i EØS-avtalen og så gjøres til norsk lov (KI-loven).","For Norway (EEA) it must first be incorporated into the EEA Agreement and then into Norwegian law (the AI Act law, «KI-loven»)."]},
{id:"p-11.7",t:11,s:"new",
 q:["Ifølge forelesningsnotatene (november 2026): hva er status for AI Act i Norge?","According to the lecture notes (November 2026): what is the status of the AI Act in Norway?"],
 o:[["Den har gjeldt fullt ut i Norge siden 2024","It has fully applied in Norway since 2024"],["Norge har valgt å ikke innføre den","Norway has chosen not to adopt it"],["Den gjelder i Norge, men bare for offentlige virksomheter","It applies in Norway, but only to public bodies"],["Den er ennå ikke norsk lov, men norske selskaper som tilbyr AI i EU må følge den der","It is not yet Norwegian law, but Norwegian companies offering AI in the EU must comply there"]],
 a:3,w:["Forordningen er ennå ikke tatt inn i EØS-avtalen. Art. 2 gjelder likevel alle som plasserer produkter på EU-markedet, og Nkom skal bli koordinerende tilsyn.","The regulation is not yet in the EEA Agreement. Art. 2 still covers anyone placing products on the EU market, and Nkom is to be the coordinating authority."]},
{id:"p-11.8",t:11,s:"new",
 q:["Artikkel 14 krever <i>human oversight</i> for høyrisikosystemer. Hva er et sentralt element?","Article 14 requires <i>human oversight</i> for high-risk systems. What is a key element?"],
 o:[["At et menneske skal kunne forstå begrensningene, være bevisst på automation bias, og overstyre eller stanse systemet","A human must be able to understand its limits, be aware of automation bias, and override or stop the system"],["At systemet aldri tar beslutninger","That the system never makes decisions"],["At et menneske merker all treningsdata","That a human labels all training data"],["At systemet har en innebygd chatbot","That the system has a built-in chatbot"]],
 a:0,w:["Automation bias = tendensen til å stole for mye på systemets output.","Automation bias = the tendency to over-trust the system's output."]},
{id:"p-11.9",t:11,s:"new",
 q:["Hva er «Brussels-effekten»?","What is the 'Brussels effect'?"],
 o:[["At EU-domstolen kan overstyre nasjonale domstoler","That the EU Court can overrule national courts"],["At EU-regler sprer seg globalt fordi internasjonale selskaper velger å følge dem overalt","That EU rules spread globally because international companies choose to follow them everywhere"],["At AI-forskning flytter fra USA til Europa","That AI research moves from the US to Europe"],["At regulering gjør EU-land mer konkurransedyktige","That regulation makes EU countries more competitive"]],
 a:1,w:["GDPR er det klassiske eksempelet (Anu Bradford, 2020). Om AI Act får samme effekt er omdiskutert.","GDPR is the classic example (Anu Bradford, 2020). Whether the AI Act will do the same is debated."]},
{id:"p-11.10",t:11,s:"new",
 q:["Siden når har personvernforordningen GDPR vært gjeldende?","Since when has the GDPR applied?"],
 o:[["1. august 2024","1 August 2024"],["2. februar 2025","2 February 2025"],["25. mai 2018","25 May 2018"],["12. juli 2016","12 July 2016"]],
 a:2,w:["Den ble vedtatt i 2016 og har gjeldt siden 25. mai 2018. 1. august 2024 er da AI Act trådte i kraft.","It was adopted in 2016 and has applied since 25 May 2018. 1 August 2024 is when the AI Act entered into force."]},
{id:"p-11.11",t:11,s:"new",
 q:["Floridi og Cowls oppsummerer etiske AI-rammeverk i fem prinsipper. Hvilket er <b>nytt</b> og ikke hentet fra bioetikken?","Floridi and Cowls summarise ethical AI frameworks in five principles. Which one is <b>new</b> and not taken from bioethics?"],
 o:[["Beneficence","Beneficence"],["Non-maleficence","Non-maleficence"],["Justice","Justice"],["Explicability","Explicability"]],
 a:3,w:["De fire første kommer fra Beauchamp og Childress (1979). Explicability trengs fordi subsymbolsk AI kan være uforståelig.","The first four come from Beauchamp & Childress (1979). Explicability is needed because subsymbolic AI can be incomprehensible."]},
{id:"p-11.12",t:11,s:"new",
 q:["Explicability-prinsippet har to komponenter. Hvilke?","The explicability principle has two components. Which?"],
 o:[["Intelligibility («hvordan virker det?») og accountability («hvem er ansvarlig?»)","Intelligibility ('how does it work?') and accountability ('who is responsible?')"],["Accuracy og robustness","Accuracy and robustness"],["Fairness og privacy","Fairness and privacy"],["Transparency og open source","Transparency and open source"]],
 a:0,w:["De to kan være oppfylt uavhengig av hverandre. Forklarbarhet er ofte en forutsetning for de fire andre prinsippene.","The two can be met independently. Explicability is often a prerequisite for the other four principles."]},
{id:"p-11.13",t:11,s:"new",
 q:["Hvordan skiller <i>justice</i> seg fra <i>fairness</i> slik notatene beskriver det?","How does <i>justice</i> differ from <i>fairness</i> as described in the notes?"],
 o:[["Justice gjelder bare juridiske systemer","Justice only applies to legal systems"],["Justice rommer mer: i tillegg til ikke-diskriminering skal AI rette opp tidligere urett, fordele goder og ikke undergrave solidaritet","Justice is broader: besides non-discrimination, AI should redress past wrongs, spread benefits and not undermine solidarity"],["Fairness er bredere enn justice","Fairness is broader than justice"],["De er identiske","They are identical"]],
 a:1,w:["I ML-litteraturen er fairness matematiske krav, f.eks. lik feilrate for ulike grupper.","In the ML literature, fairness means mathematical criteria, e.g. equal error rates across groups."]},
{id:"p-11.14",t:11,s:"new",
 q:["Hva er forskjellen mellom non-maleficence og beneficence?","What is the difference between non-maleficence and beneficence?"],
 o:[["Ingen, de betyr det samme","None, they mean the same"],["Non-maleficence gjelder bare bevisst ondsinnet bruk","Non-maleficence only covers deliberately malicious use"],["Å unnlate å gjøre skade (non-maleficence) er noe annet enn å aktivt gjøre godt (beneficence)","Not doing harm (non-maleficence) is different from actively doing good (beneficence)"],["Beneficence gjelder bare medisin","Beneficence only applies to medicine"]],
 a:2,w:["Non-maleficence brytes også av utilsiktet skade, f.eks. personvernbrudd eller svak cybersikkerhet. Et system kan oppfylle det uten å gjøre noe godt.","Non-maleficence is also broken by unintended harm, e.g. privacy breaches or weak security. A system can satisfy it without doing any good."]}
);

{id:"p-0.tf1",t:0,s:"new",kind:"tf",
 q:["Påstand: Det er greit å tilpasse StandardScaler på hele datasettet før du splitter i trening og test.","Statement: It is fine to fit a StandardScaler on the whole dataset before splitting into train and test."],
 o:[["Sant","True"],["Usant","False"]],a:1,

 w:["Usant. Splitt først, tilpass scaleren på treningsdata, og bruk <code>transform</code> på test.","False. Split first, fit the scaler on training data, then <code>transform</code> the test data."]},
{id:"p-0.tf2",t:0,s:"new",kind:"tf",
 q:["Påstand: One-hot-koding av en nominell variabel med 5 mulige verdier gir 5 binære kolonner (eller 4 hvis én droppes som referanse).","Statement: One-hot encoding a nominal variable with 5 possible values gives 5 binary columns (or 4 if one is dropped as reference)."],
 o:[["Sant","True"],["Usant","False"]],a:0,
 x:[null,["Hver kategori får sin egen 0/1-kolonne, så antallet kolonner følger antallet kategorier.","Each category gets its own 0/1 column, so the number of columns follows the number of categories."]],
 w:["Sant. Én kolonne per kategori, med 1 i kolonnen for verdien datapunktet har.","True. One column per category, with a 1 in the column for the data point's value."]},
{id:"p-0.tf3",t:0,s:"new",kind:"tf",
 q:["Påstand: Testsettet er det riktige stedet å velge hyperparametere, siden det gir det mest ærlige estimatet.","Statement: The test set is the right place to choose hyperparameters, since it gives the most honest estimate."],
 o:[["Sant","True"],["Usant","False"]],a:1,
 x:[["Tuner du på testsettet, slutter det å være usett, og sluttestimatet blir for optimistisk.","If you tune on the test set it is no longer unseen, and the final estimate becomes too optimistic."],null],
 w:["Usant. Hyperparametere velges med valideringssett eller kryssvalidering. Testsettet brukes én gang til slutt.","False. Hyperparameters are chosen with a validation set or cross-validation. The test set is used once at the end."]},
{id:"p-0.m1",t:0,s:"new",kind:"multi",
 q:["Hvilke av disse er eksempler på datalekkasje (data leakage)? Velg alle utsagn som er sanne.","Which of these are examples of data leakage? Select all statements that are true."],
 o:[["Å tilpasse en scaler på hele datasettet før train/test-splitt","Fitting a scaler on the whole dataset before the train/test split"],
    ["Å bruke en feature som bare er kjent etter at targeten er bestemt (f.eks. «behandling gitt» for å predikere diagnose)","Using a feature that is only known after the target is determined (e.g. 'treatment given' to predict diagnosis)"],
    ["Å tilpasse scaleren kun på treningsdataene","Fitting the scaler on the training data only"],
    ["Å stokke treningsdataene før trening","Shuffling the training data before training"],
    ["Å velge features basert på hvor godt de fungerer på testsettet","Selecting features based on how well they perform on the test set"]],
 a:[0,1,4],
 x:[["Sant: μ/σ eller min/maks fra testdataene lekker inn i treningen.","True: μ/σ or min/max from the test data leak into training."],
    ["Sant: featuren inneholder informasjon om svaret som ikke finnes når modellen brukes.","True: the feature contains information about the answer that isn't available when the model is used."],
    ["Usant: dette er den korrekte måten å gjøre det på.","False: this is the correct way to do it."],
    ["Usant: stokking av treningsdata er vanlig og ufarlig. Ingen testinformasjon brukes.","False: shuffling training data is common and harmless. No test information is used."],
    ["Sant: testsettet påvirker da modellvalget og er ikke lenger usett.","True: the test set then influences model choices and is no longer unseen."]],
 w:["Lekkasje = informasjon som modellen ikke ville hatt i praksis (testdata eller fremtiden) påvirker treningen.","Leakage = information the model wouldn't have in practice (test data or the future) influences training."]},
{id:"p-0.m2",t:0,s:"new",kind:"multi",
 q:["Titanic-datasettet (Survived, Sex, Age, Pclass, PassengerId, Name). Velg alle utsagn som er sanne.","The Titanic dataset (Survived, Sex, Age, Pclass, PassengerId, Name). Select all statements that are true."],
 o:[["Sex er en binær variabel","Sex is a binary variable"],
    ["Age er en kontinuerlig variabel","Age is a continuous variable"],
    ["Pclass er en kategorisk (ordinal) variabel","Pclass is a categorical (ordinal) variable"],
    ["PassengerId er en nyttig feature for å predikere overlevelse","PassengerId is a useful feature for predicting survival"]],
 a:[0,1,2],
 x:[["Sant: to verdier (male/female) i datasettet.","True: two values (male/female) in the dataset."],
    ["Sant: alder er en kontinuerlig størrelse.","True: age is a continuous quantity."],
    ["Sant: tre klasser (1., 2. og 3.) med en naturlig rekkefølge.","True: three classes (1st, 2nd, 3rd) with a natural order."],
    ["Usant: en ID er unik per rad og har ingen generaliserbar sammenheng med targeten.","False: an ID is unique per row and has no generalisable relation to the target."]],
 w:["Forelesningsnotatene: Sex og Survived er binære, Age er kontinuerlig, PassengerId og Name bør ikke brukes.","From the lecture notes: Sex and Survived are binary, Age is continuous, PassengerId and Name should not be used."]},
{id:"p-0.m3",t:0,s:"new",kind:"multi",
 q:["Om trenings-, validerings- og testsett: Velg alle utsagn som er sanne.","About training, validation and test sets: Select all statements that are true."],
 o:[["Treningsdata brukes til å lære modellparametrene","Training data is used to learn the model parameters"],
    ["Valideringsdata brukes til å velge hyperparametere og modell","Validation data is used to choose hyperparameters and models"],
    ["Testsettet bør bare brukes til den endelige evalueringen","The test set should only be used for the final evaluation"],
    ["Testsettet kan gjenbrukes mange ganger for å tune modellen til best mulig score","The test set can be reused many times to tune the model to the best score"]],
 a:[0,1,2],
 x:[["Sant: w og b tilpasses på treningsdataene.","True: w and b are fitted on the training data."],
    ["Sant: dette er nettopp hensikten med valideringssettet.","True: this is exactly what the validation set is for."],
    ["Sant: slik gir det et ærlig estimat av ytelse på usette data.","True: that way it gives an honest estimate of performance on unseen data."],
    ["Usant: gjentatt tuning på testsettet overtilpasser til det, og estimatet blir for optimistisk.","False: repeated tuning on the test set overfits to it and makes the estimate too optimistic."]],
 w:["Train → lær parametere, validering → velg hyperparametere, test → én ærlig sluttmåling.","Train → learn parameters, validation → pick hyperparameters, test → one honest final measurement."]},

// ===== Topic 1: Logistic regression & gradient descent =====
{id:"p-1.tf1",t:1,s:"new",kind:"tf",
 q:["Påstand: Sigmoid-funksjonen σ(z) = 1/(1 + e<sup>−z</sup>) gir σ(0) = 0.5.","Statement: The sigmoid function σ(z) = 1/(1 + e<sup>−z</sup>) gives σ(0) = 0.5."],
 o:[["Sant","True"],["Usant","False"]],a:0,
 x:[null,["e<sup>0</sup> = 1, så σ(0) = 1/(1+1) = 0.5.","e<sup>0</sup> = 1, so σ(0) = 1/(1+1) = 0.5."]],
 w:["Sant. Derfor svarer terskel 0.5 til z = wᵀx + b = 0.","True. That's why threshold 0.5 corresponds to z = wᵀx + b = 0."]},
{id:"p-1.tf2",t:1,s:"new",kind:"tf",
 q:["Påstand: Én epoke betyr én oppdatering av modellparametrene.","Statement: One epoch means one update of the model parameters."],
 o:[["Sant","True"],["Usant","False"]],a:1,
 x:[["En epoke er én gjennomgang av hele treningsdatasettet. Med minibatcher gir det mange oppdateringer.","An epoch is one pass over the whole training set. With minibatches that means many updates."],null],
 w:["Usant. Antall oppdateringer per epoke = N / batch size (bare 1 ved full-batch gradient descent).","False. Updates per epoch = N / batch size (only 1 for full-batch gradient descent)."]},
{id:"p-1.tf3",t:1,s:"new",kind:"tf",
 q:["Påstand: Gradient descent flytter parametrene i retning av den <b>negative</b> gradienten til tapsfunksjonen.","Statement: Gradient descent moves the parameters in the direction of the <b>negative</b> gradient of the loss."],
 o:[["Sant","True"],["Usant","False"]],a:0,
 x:[null,["Gradienten peker mot bratteste økning. For å minimere går vi motsatt vei: θ ← θ − α∇L.","The gradient points towards steepest increase. To minimise we go the opposite way: θ ← θ − α∇L."]],
 w:["Sant. Oppdateringsregelen er θ ← θ − α·∂L/∂θ.","True. The update rule is θ ← θ − α·∂L/∂θ."]},
{id:"p-1.m1",t:1,s:"new",kind:"multi",
 q:["Om læringsraten α i gradient descent: Velg alle utsagn som er sanne.","About the learning rate α in gradient descent: Select all statements that are true."],
 o:[["For høy α kan få tapet til å oscillere eller divergere","Too high an α can make the loss oscillate or diverge"],
    ["For lav α gir svært treg konvergens","Too low an α gives very slow convergence"],
    ["α læres automatisk med backpropagation","α is learned automatically by backpropagation"],
    ["α er en hyperparameter","α is a hyperparameter"]],
 a:[0,1,3],
 x:[["Sant: store steg hopper over minimum.","True: big steps overshoot the minimum."],
    ["Sant: små steg betyr mange iterasjoner før vi når minimum.","True: small steps mean many iterations before reaching the minimum."],
    ["Usant: backpropagation beregner gradienter for parametrene. α velger vi selv.","False: backpropagation computes gradients for the parameters. We choose α ourselves."],
    ["Sant: den settes før treningen og læres ikke fra data.","True: it's set before training and not learned from data."]],
 w:["Læringsraten er en hyperparameter som balanserer konvergenshastighet mot stabilitet.","The learning rate is a hyperparameter that trades convergence speed against stability."]},
{id:"p-1.m2",t:1,s:"new",kind:"multi",
 q:["Om logistisk regresjon: Velg alle utsagn som er sanne.","About logistic regression: Select all statements that are true."],
 o:[["Outputen ligger i intervallet (0, 1)","The output lies in the interval (0, 1)"],
    ["Beslutningsgrensen er lineær i feature-rommet","The decision boundary is linear in feature space"],
    ["Den trenes typisk ved å minimere binary cross entropy","It is typically trained by minimising binary cross entropy"],
    ["w og b er hyperparametere som vi velger før trening","w and b are hyperparameters we choose before training"],
    ["Den deriverte av sigmoid er σ(z)(1 − σ(z))","The derivative of the sigmoid is σ(z)(1 − σ(z))"]],
 a:[0,1,2,4],
 x:[["Sant: sigmoid presser alle reelle tall inn i (0,1).","True: the sigmoid squashes every real number into (0,1)."],
    ["Sant: grensen σ(z) = 0.5 tilsvarer hyperplanet wᵀx + b = 0.","True: the boundary σ(z) = 0.5 is the hyperplane wᵀx + b = 0."],
    ["Sant: dette er den negative log-likelihooden til en Bernoulli-modell.","True: this is the negative log-likelihood of a Bernoulli model."],
    ["Usant: w og b er modellparametere som læres fra data.","False: w and b are model parameters learned from data."],
    ["Sant: dette gjør gradienten for cross entropy-tapet så enkel: (σ − y)·x.","True: this is what makes the cross entropy gradient so simple: (σ − y)·x."]],
 w:["Logistisk regresjon = lineær modell + sigmoid, trent med cross entropy og gradient descent.","Logistic regression = linear model + sigmoid, trained with cross entropy and gradient descent."]},
{id:"p-1.m3",t:1,s:"new",kind:"multi",
 q:["Om batch, minibatch og stochastic gradient descent: Velg alle utsagn som er sanne.","About batch, minibatch and stochastic gradient descent: Select all statements that are true."],
 o:[["Stochastic gradient descent oppdaterer parametrene basert på ett (eller noen få) datapunkt om gangen","Stochastic gradient descent updates the parameters from one (or a few) data points at a time"],
    ["Full-batch gradient descent bruker hele treningssettet per oppdatering","Full-batch gradient descent uses the whole training set per update"],
    ["Mindre batch size gir mer støy i gradientestimatet","A smaller batch size gives a noisier gradient estimate"],
    ["Antall iterasjoner per epoke = antall treningspunkter / batch size","Iterations per epoch = number of training points / batch size"]],
 a:[0,1,2,3],
 x:[["Sant: hver oppdatering bruker et lite, tilfeldig utvalg.","True: each update uses a small random sample."],
    ["Sant: én oppdatering per epoke.","True: one update per epoch."],
    ["Sant: færre punkter gir et mindre presist gjennomsnitt av gradienten.","True: fewer points give a less precise average gradient."],
    ["Sant: f.eks. 10 000 / 500 = 20 iterasjoner.","True: e.g. 10,000 / 500 = 20 iterations."]],
 w:["Alle fire er sanne. Batch size styrer avveiningen mellom støy og regnekostnad per steg.","All four are true. Batch size controls the trade-off between noise and compute per step."]},

// --- 2024 exam original (multi-select) ---
{id:"e24-2a-m",t:1,s:"e24",kind:"multi",
 q:["Lineær modell f(x) = wx + b, tapsfunksjon L = ½(y − f(x))², startverdier w = 1, b = 0. Beregn gradientene ∂L/∂w og ∂L/∂b for datapunktet x = 2, y = 4. Velg ett eller flere alternativer.","Linear model f(x) = wx + b, loss L = ½(y − f(x))², starting values w = 1, b = 0. Compute the gradients ∂L/∂w and ∂L/∂b for the data point x = 2, y = 4. Select one or more options."],
 o:[["∂L/∂b = 3","∂L/∂b = 3"],["∂L/∂w = 2","∂L/∂w = 2"],["∂L/∂w = −6","∂L/∂w = −6"],["∂L/∂b = −3","∂L/∂b = −3"],["∂L/∂b = 2","∂L/∂b = 2"],["∂L/∂b = −2","∂L/∂b = −2"],["∂L/∂w = 4","∂L/∂w = 4"],["∂L/∂w = −4","∂L/∂w = −4"]],
 a:[5,7],
 x:[["Usant: ∂L/∂b = −(y − f) = −(4 − 2) = −2.","False: ∂L/∂b = −(y − f) = −(4 − 2) = −2."],
    ["Usant: ∂L/∂w = −(y − f)·x = −2·2 = −4.","False: ∂L/∂w = −(y − f)·x = −2·2 = −4."],
    ["Usant: −6 får du med y − f = 3, men f(2) = 2, så y − f = 2.","False: −6 comes from y − f = 3, but f(2) = 2, so y − f = 2."],
    ["Usant: y − f = 2, ikke 3.","False: y − f = 2, not 3."],
    ["Usant: riktig størrelse, men fortegnet er feil. f < y gir negativ gradient.","False: right magnitude, wrong sign. f < y gives a negative gradient."],
    ["Sant: ∂L/∂b = −(y − f) = −2.","True: ∂L/∂b = −(y − f) = −2."],
    ["Usant: riktig størrelse, men fortegnet er feil.","False: right magnitude, wrong sign."],
    ["Sant: ∂L/∂w = −(y − f)·x = −2·2 = −4.","True: ∂L/∂w = −(y − f)·x = −2·2 = −4."]],
 w:["f(2) = 2, ∂L/∂f = −(y − f) = −2. Kjerneregelen gir ∂L/∂w = −2·x = −4 og ∂L/∂b = −2.","f(2) = 2, ∂L/∂f = −(y − f) = −2. The chain rule gives ∂L/∂w = −2·x = −4 and ∂L/∂b = −2."]},
{id:"e24-2b-m",t:1,s:"e24",kind:"multi",
 q:["Fortsettelse: bruk læringsraten α = 0.1 og oppdateringsregelen θ ← θ − α ∂L/∂θ (med ∂L/∂w = −4, ∂L/∂b = −2, w = 1, b = 0). Hva blir de oppdaterte verdiene? Velg ett eller flere alternativer.","Continuing: use learning rate α = 0.1 and the update rule θ ← θ − α ∂L/∂θ (with ∂L/∂w = −4, ∂L/∂b = −2, w = 1, b = 0). What are the updated values? Select one or more options."],
 o:[["w = 1.4","w = 1.4"],["b = −0.2","b = −0.2"],["b = 0.2","b = 0.2"],["w = 0.6","w = 0.6"]],
 a:[0,2],
 x:[["Sant: w = 1 − 0.1·(−4) = 1.4.","True: w = 1 − 0.1·(−4) = 1.4."],
    ["Usant: b = 0 − 0.1·(−2) = +0.2. Fortegnet er snudd.","False: b = 0 − 0.1·(−2) = +0.2. The sign is flipped."],
    ["Sant: b = 0 − 0.1·(−2) = 0.2.","True: b = 0 − 0.1·(−2) = 0.2."],
    ["Usant: 0.6 får du om du legger til gradienten i stedet for å trekke den fra.","False: 0.6 comes from adding the gradient instead of subtracting it."]],
 w:["Negative gradienter betyr at både w og b skal øke: w = 1.4 og b = 0.2.","Negative gradients mean both w and b should increase: w = 1.4 and b = 0.2."]},

// ===== Topic 2: Classification metrics =====
{id:"p-2.tf1",t:2,s:"new",kind:"tf",
 q:["Påstand: Recall = TP / (TP + FN).","Statement: Recall = TP / (TP + FN)."],
 o:[["Sant","True"],["Usant","False"]],a:0,
 x:[null,["Recall er andelen faktiske positive som modellen finner, og det er nettopp TP/(TP+FN).","Recall is the share of actual positives the model finds, which is exactly TP/(TP+FN)."]],
 w:["Sant. Recall kalles også sensitivitet eller true positive rate (TPR).","True. Recall is also called sensitivity or true positive rate (TPR)."]},
{id:"p-2.tf2",t:2,s:"new",kind:"tf",
 q:["Påstand: En ROC AUC på 0.5 betyr at modellen alltid tar feil.","Statement: A ROC AUC of 0.5 means the model is always wrong."],
 o:[["Sant","True"],["Usant","False"]],a:1,
 x:[["AUC 0.5 er tilfeldig gjetning. En modell som alltid rangerer feil har AUC 0, og den kan snus til en perfekt modell.","AUC 0.5 is random guessing. A model that always ranks wrongly has AUC 0, and flipping it gives a perfect model."],null],
 w:["Usant. AUC = 0.5 tilsvarer diagonalen: modellen skiller ikke klassene bedre enn tilfeldig.","False. AUC = 0.5 is the diagonal: the model separates the classes no better than chance."]},
{id:"p-2.tf3",t:2,s:"new",kind:"tf",
 q:["Påstand: Hvis du senker klassifiseringsterskelen, vil recall øke eller holde seg uendret.","Statement: If you lower the classification threshold, recall will increase or stay the same."],
 o:[["Sant","True"],["Usant","False"]],a:0,
 x:[null,["Lavere terskel kan bare gjøre flere prediksjoner positive, så TP kan ikke synke, og FN kan ikke øke.","A lower threshold can only turn more predictions positive, so TP can't fall and FN can't grow."]],
 w:["Sant. Lavere terskel gir flere positive prediksjoner: recall ↑ (eller lik), mens precision ofte synker.","True. A lower threshold gives more positive predictions: recall ↑ (or equal), while precision often falls."]},
{id:"p-2.m1",t:2,s:"new",kind:"multi",
 q:["Confusion matrix: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>40</td><td>10</td></tr><tr><th>Label −</th><td>30</td><td>20</td></tr></table>Velg alle utsagn som er sanne.","Confusion matrix: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>40</td><td>10</td></tr><tr><th>Label −</th><td>30</td><td>20</td></tr></table>Select all statements that are true."],
 o:[["Recall = 0.8","Recall = 0.8"],["Precision ≈ 0.57","Precision ≈ 0.57"],["Accuracy = 0.6","Accuracy = 0.6"],["Specificity = 0.6","Specificity = 0.6"],["FPR = 0.6","FPR = 0.6"]],
 a:[0,1,2,4],
 x:[["Sant: 40 / (40 + 10) = 0.8.","True: 40 / (40 + 10) = 0.8."],
    ["Sant: 40 / (40 + 30) ≈ 0.57.","True: 40 / (40 + 30) ≈ 0.57."],
    ["Sant: (40 + 20) / 100 = 0.6.","True: (40 + 20) / 100 = 0.6."],
    ["Usant: specificity = TN / (TN + FP) = 20/50 = 0.4. Det er FPR som er 0.6.","False: specificity = TN / (TN + FP) = 20/50 = 0.4. It's the FPR that is 0.6."],
    ["Sant: FP / (FP + TN) = 30/50 = 0.6.","True: FP / (FP + TN) = 30/50 = 0.6."]],
 w:["TP = 40, FN = 10, FP = 30, TN = 20. Merk at FPR = 1 − specificity.","TP = 40, FN = 10, FP = 30, TN = 20. Note that FPR = 1 − specificity."]},
{id:"p-2.m2",t:2,s:"new",kind:"multi",
 q:["Om precision og recall: Velg alle utsagn som er sanne.","About precision and recall: Select all statements that are true."],
 o:[["Å øke terskelen gir typisk høyere precision","Raising the threshold typically gives higher precision"],
    ["Recall kalles også sensitivitet eller true positive rate","Recall is also called sensitivity or true positive rate"],
    ["Precision og specificity er samme metrikk","Precision and specificity are the same metric"],
    ["Ved screening for alvorlig sykdom er recall vanligvis viktigst","In screening for a serious disease, recall is usually the most important"]],
 a:[0,1,3],
 x:[["Sant: færre, men sikrere positive prediksjoner gir færre FP.","True: fewer but more confident positive predictions mean fewer FP."],
    ["Sant: TP/(TP+FN) har alle tre navnene.","True: TP/(TP+FN) goes by all three names."],
    ["Usant: precision = TP/(TP+FP), specificity = TN/(TN+FP). Ulike nevnere og tellere.","False: precision = TP/(TP+FP), specificity = TN/(TN+FP). Different numerators and denominators."],
    ["Sant: det er verst å overse syke (falske negative).","True: missing sick patients (false negatives) is worst."]],
 w:["Precision straffer FP, recall straffer FN. Hvilken som er viktigst avhenger av kostnaden ved hver feiltype.","Precision penalises FP, recall penalises FN. Which matters more depends on the cost of each error type."]},
{id:"p-2.m3",t:2,s:"new",kind:"multi",
 q:["Om ROC-kurven: Velg alle utsagn som er sanne.","About the ROC curve: Select all statements that are true."],
 o:[["Aksene er FPR (x-akse) og TPR (y-akse)","The axes are FPR (x-axis) and TPR (y-axis)"],
    ["Hvert punkt på kurven tilsvarer én klassifiseringsterskel","Each point on the curve corresponds to one classification threshold"],
    ["En perfekt klassifikator går gjennom punktet (0, 1)","A perfect classifier passes through the point (0, 1)"],
    ["ROC-kurven er laget for én fast terskel på 0.5","The ROC curve is made for one fixed threshold of 0.5"],
    ["AUC = 1.0 betyr at alle positive rangeres over alle negative","AUC = 1.0 means every positive is ranked above every negative"]],
 a:[0,1,2,4],
 x:[["Sant: FPR horisontalt, TPR vertikalt.","True: FPR horizontally, TPR vertically."],
    ["Sant: kurven tegnes ved å variere terskelen fra 1 til 0.","True: the curve is drawn by sweeping the threshold from 1 to 0."],
    ["Sant: TPR = 1 og FPR = 0 samtidig.","True: TPR = 1 and FPR = 0 at the same time."],
    ["Usant: hele poenget er å vise alle terskler, ikke én.","False: the whole point is to show all thresholds, not one."],
    ["Sant: AUC er sannsynligheten for riktig rangering av et tilfeldig (positivt, negativt) par.","True: AUC is the probability of correctly ranking a random (positive, negative) pair."]],
 w:["ROC viser avveiningen mellom TPR og FPR over alle terskler. AUC oppsummerer den i ett tall.","ROC shows the TPR–FPR trade-off over all thresholds. AUC sums it up in one number."]},

// --- 2024 exam originals (multi-select) ---
{id:"e24-5a-m",t:2,s:"e24",kind:"multi",fig:"roc",
 q:["En modell gir følgende confusion matrix for terskel <b>0.3</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>40</td><td>10</td></tr><tr><th>Label −</th><td>30</td><td>20</td></tr></table>og for terskel <b>0.7</b>: <table class='cm'><tr><th></th><th>Pred +</th><th>Pred −</th></tr><tr><th>Label +</th><td>25</td><td>25</td></tr><tr><th>Label −</th><td>10</td><td>40</td></tr></table>Se på ROC-kurven. Hvilke utsagn er riktige? Velg ett eller flere alternativer.",

{id:"e24-5b-m",t:2,s:"e24",kind:"multi",fig:"roc",
